<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>獎金系統 - 動態分母同步版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; --bg: #f4f7f6; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; position: relative; }
        .loading-mask { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:100; align-items:center; justify-content:center; font-weight:bold; }
        .header-controls { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; font-size: 1.5rem; font-weight: bold; }
        select, input { font-size: 1.4rem; padding: 10px; border: 2px solid var(--accent); border-radius: 8px; }
        .score-container { display: flex; flex-wrap: wrap; gap: 10px; background: #eef2f7; padding: 20px; border-radius: 12px; }
        .q-score { width: 75px; height: 50px; font-size: 1.4rem; text-align: center; border: 2px solid #ccc; border-radius: 8px; font-weight: bold; }
        .avg-display { background: var(--primary); color: white; padding: 15px 25px; border-radius: 10px; font-size: 1.5rem; margin-left: auto; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; }
        .adj-input { width: 100px; color: var(--danger); font-size: 1.2rem; font-weight: bold; border: 2px dashed var(--danger); text-align: center; }
        .total-cell { font-size: 1.8rem; font-weight: bold; background: #fff3cd; color: #d35400; }
    </style>
</head>
<body>

<div class="card">
    <div class="loading-mask" id="loading">連線中...</div>
    <div class="header-controls">
        員工：<select id="selEmp" onchange="initUI()"></select>
        年度：<input type="number" id="calcYear" value="2025" onchange="autoCalc()">
        <button class="btn" style="background:var(--danger);" id="unlockBtn" onclick="askPassword()">🔒 主管核定</button>
    </div>
    <div id="scoreInputs" class="score-container"></div>
    <div style="height:250px; margin-top:15px;"><canvas id="scoreChart"></canvas></div>
</div>

<div id="adminZone" style="display:none;" class="card">
    <h2 style="color:var(--danger)">2. 核定區：<span style="color:var(--success)">■ 公式</span> + <span style="color:var(--danger)">■ 調整</span></h2>
    <table style="width:100%; border-collapse:collapse; text-align:center; margin-bottom:20px;">
        <thead><tr style="background:#eee;"><th>姓名</th><th>年度</th><th>平均分</th><th>五一</th><th>端午</th><th>中秋</th><th>年終</th><th>實領總計</th></tr></thead>
        <tbody id="resultBody"></tbody>
    </table>
    <div style="text-align:right;">
        <button id="saveBtn" onclick="handleFinalSave()" class="btn" style="background:var(--success); padding: 15px 50px;">✅ 確認核定存檔</button>
    </div>
    <div style="height: 400px; margin-top:20px;"><canvas id="yearTrendChart"></canvas></div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz9kLPJjKS5XZsYmgy_Hk77YKKL7X_8qIJkQrNGyJLEcGb3XKrb0lotAjcNhRCL5EXB/exec"; 
    let scoreChart = null, yearTrendChart = null, timelineData = {}, baseResults = {};
    Chart.register(ChartDataLabels);

    function showLoading(s) { document.getElementById('loading').style.display = s ? 'flex' : 'none'; }

    window.onload = async () => {
        showLoading(true);
        const res = await fetch(API_URL);
        const r = await res.json();
        document.getElementById('selEmp').innerHTML = r.data.map(e => `<option value="${e.name}" data-rank="${e.rank}" data-salary="${e.salary}">${e.name}</option>`).join('');
        initUI();
        showLoading(false);
    };

    function initUI() {
        const sel = document.getElementById('selEmp');
        const opt = sel.options[sel.selectedIndex];
        const count = opt.dataset.rank === 'L1' ? 12 : 4;
        let html = '';
        for(let i=0; i<count; i++) html += `<div><small>${i+1}</small><br><input type="number" class="q-score" oninput="localUpdate()"></div>`;
        html += `<div class="avg-display">平均：<span id="avgSpan">0.00</span></div>`;
        document.getElementById('scoreInputs').innerHTML = html;
        timelineData = { Q1:{r:opt.dataset.rank, s:opt.dataset.salary}, Q2:{r:opt.dataset.rank, s:opt.dataset.salary}, Q3:{r:opt.dataset.rank, s:opt.dataset.salary}, Q4:{r:opt.dataset.rank, s:opt.dataset.salary} };
        autoCalc(); 
    }

    // 核心邏輯：前端算出平均分，供後面所有步驟使用
    function localUpdate() {
        const inputs = Array.from(document.querySelectorAll('.q-score'));
        const scores = inputs.map(i => i.value==="" ? null : parseFloat(i.value));
        const valid = scores.filter(v => v !== null && !isNaN(v));
        
        // 動態分母平均
        const avg = valid.length > 0 ? (valid.reduce((a,b)=>a+b,0)/valid.length).toFixed(2) : "0.00";
        document.getElementById('avgSpan').innerText = avg;
        
        updateScoreChart(inputs, scores);
        clearTimeout(window.calcTimer);
        window.calcTimer = setTimeout(autoCalc, 800);
    }

    async function autoCalc() {
        const avgScore = document.getElementById('avgSpan').innerText;
        const inputs = document.querySelectorAll('.q-score');
        const scores = Array.from(inputs).map(i => i.value === "" ? null : i.value);
        
        try {
            const res = await fetch(API_URL, { 
                method: "POST", 
                body: JSON.stringify({ 
                    action: "calculateBonus", 
                    empName: document.getElementById('selEmp').value, 
                    year: document.getElementById('calcYear').value, 
                    scores, 
                    timeline: timelineData,
                    avgScore: avgScore // 將前端算好的動態分母平均傳給後端
                }) 
            });
            const r = await res.json();
            if(r.status === "success") {
                baseResults = r.data;
                const hAdjs = r.historyAdjs || [0,0,0,0];
                document.getElementById('resultBody').innerHTML = `
                    <tr>
                        <td>${document.getElementById('selEmp').value}</td><td>${document.getElementById('calcYear').value}</td>
                        <td style="font-weight:bold; color:blue;">${avgScore}</td>
                        ${ ['f1','f2','f3','ye'].map((k, i) => `<td><small style="color:green;font-weight:bold">${baseResults[k]}</small><br><input type="number" class="adj-input" id="adj_${k}" value="${hAdjs[i]}" style="border:2px dashed red" oninput="refreshTotal(); updateTrendChart();"></td>`).join('') }
                        <td id="totalCell" class="total-cell">0</td>
                    </tr>`;
                refreshTotal();
                if(document.getElementById('adminZone').style.display === 'block') updateTrendChart();
            }
        } catch(e) { console.error(e); }
    }

    function updateTrendChart() {
        const ctx = document.getElementById('yearTrendChart').getContext('2d');
        if (yearTrendChart) yearTrendChart.destroy();
        const base = ['f1', 'f2', 'f3', 'ye'].map(k => baseResults[k] || 0);
        const adj = ['f1', 'f2', 'f3', 'ye'].map(k => parseFloat(document.getElementById('adj_'+k).value) || 0);
        yearTrendChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: ['五一', '端午', '中秋', '年終'], datasets: [
                { label: '公式', data: base, backgroundColor: '#27ae60', stack: 'S' },
                { label: '調整', data: adj, backgroundColor: '#e74c3c', stack: 'S' }
            ]},
            options: { maintainAspectRatio: false, scales: { x: {stacked:true}, y: {stacked:true} }, plugins: { datalabels: { anchor:'center', color:'white', font:{weight:'bold'} } } }
        });
    }

    function refreshTotal() {
        let t = 0;
        ['f1','f2','f3','ye'].forEach(k => { t += (baseResults[k]||0) + (parseFloat(document.getElementById('adj_'+k).value)||0); });
        document.getElementById('totalCell').innerText = t.toLocaleString();
    }

    async function handleFinalSave() {
        showLoading(true);
        const adjs = ["f1","f2","f3","ye"].map(id => parseFloat(document.getElementById("adj_"+id).value) || 0);
        const scores = Array.from(document.querySelectorAll('.q-score')).map(i => i.value === "" ? null : parseFloat(i.value));
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ 
            action: "saveRecord", year: document.getElementById('calcYear').value, empName: document.getElementById('selEmp').value, 
            rank: timelineData.Q4.r, avgScore: document.getElementById('avgSpan').innerText, 
            f1_base: baseResults.f1, f1_adj: adjs[0], f2_base: baseResults.f2, f2_adj: adjs[1],
            f3_base: baseResults.f3, f3_adj: adjs[2], ye_base: baseResults.ye, ye_adj: adjs[3],
            total: (baseResults.f1+baseResults.f2+baseResults.f3+baseResults.ye + adjs.reduce((a,b)=>a+b,0)), 
            scores, timeline: timelineData 
        }) });
        const r = await res.json();
        showLoading(false);
        if(r.status === "success") alert("✅ 核定存檔成功！");
    }

    function updateScoreChart(inputs, scores) {
        const ctx = document.getElementById('scoreChart').getContext('2d');
        if (scoreChart) scoreChart.destroy();
        scoreChart = new Chart(ctx, { type: 'line', data: { labels: inputs.map((_,i)=>i+1), datasets: [{ label: '評分', data: scores, borderColor: '#3498db', tension: 0.3 }] }, options: { maintainAspectRatio: false } });
    }
    function askPassword() { if(prompt("密碼")==="0000") { document.getElementById('adminZone').style.display='block'; setTimeout(updateTrendChart, 100); } }
</script>
</body>
</html>
