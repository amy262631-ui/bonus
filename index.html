<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>獎金管理系統 - 終極穩定專業版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; --project: #e67e22; --bg: #f4f7f6; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 25px; position: relative; }
        .header-controls { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; }
        #selEmp, #calcYear { padding: 8px 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 1.1rem; }
        
        /* 標題在上方排版 */
        .score-container { display: flex; flex-direction: column; gap: 10px; padding: 15px; background: #f8f9fa; border-radius: 10px; border-left: 8px solid var(--primary); margin-bottom: 15px; }
        .score-grid { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
        .input-group { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .input-label { font-size: 0.85rem; color: #666; font-weight: bold; }
        .q-score { width: 55px; height: 35px; text-align: center; font-size: 1.1rem; border: 2px solid #ddd; border-radius: 6px; font-weight: bold; }
        .avg-display { min-width: 150px; background: var(--primary); color: white; padding: 10px; border-radius: 8px; text-align: center; margin-left: auto; font-size: 1.1rem; font-weight: bold; }
        
        .target-input { width: 105px; height: 40px; color: var(--danger); font-size: 1.35rem; border: 2px solid var(--danger); text-align: center; font-weight: bold; background: #fff5f5; border-radius: 6px; }
        .reference-text { color: #27ae60; font-weight: bold; font-size: 0.9rem; display: block; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .timeline-table, .report-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .timeline-table th, .timeline-table td, .report-table th, .report-table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        .total-cell { font-size: 2.2rem; font-weight: bold; background: #fff3cd; color: #d35400; min-width: 150px; }
        h2 { border-left: 8px solid var(--accent); padding-left: 15px; display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }
        .download-btn { background: #7f8c8d; padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; color: white; cursor: pointer; border: none; }
        #reportModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; overflow-y: auto; padding: 40px 20px; }
        .report-content { background: white; max-width: 1100px; margin: 0 auto; padding: 40px; border-radius: 15px; position: relative; }
        @media print { body * { visibility: hidden; } #reportModal, #reportModal * { visibility: visible; } #reportModal { position: absolute; left: 0; top: 0; width: 100%; background: white; padding: 0; } .no-print { display: none !important; } }
    </style>
</head>
<body>

<div class="card">
    <div class="header-controls">
        <span>👤 人員：</span><select id="selEmp" onchange="initUI()"></select>
        <span>📅 年度：</span><input type="number" id="calcYear" value="2025" onchange="autoCalc(true)">
        <button class="btn" style="background:var(--success);" onclick="handleFinalSave()">💾 儲存數據</button>
        <button id="unlockBtn" class="btn" style="background:var(--danger); margin-left:auto;" onclick="askPassword()">🔒 主管解鎖</button>
    </div>

    <div class="score-container">
        <div style="font-weight:bold; color:var(--primary);">🗓️ 年度績效評分</div>
        <div id="annualInputs" class="score-grid"></div>
        <div class="avg-display" style="margin-top:10px;">年度平均：<span id="avgSpan">0.00</span></div>
    </div>

    <div class="score-container" style="border-left-color: var(--project); background: #fdf5e6;">
        <div style="font-weight:bold; color:var(--project);">🚀 專案表現評分</div>
        <div id="projInputs" class="score-grid"></div>
        <div class="avg-display" style="background:var(--project); margin-top:10px;">專案平均：<span id="projAvgSpan">0.00</span></div>
    </div>
    
    <h2>📊 綜合趨勢圖 <button class="download-btn" onclick="downloadChart('scoreChart', '績效綜合趨勢')">📸 下載圖表</button></h2>
    <div style="height:350px;"><canvas id="scoreChart"></canvas></div>
</div>

<div id="adminZone" style="display:none;">
    <div class="card" style="border: 2px solid var(--danger);">
        <h2 style="color:var(--danger); border-left-color:var(--danger)">主管獎金核定 (職等/薪資變更將同步重新試算)</h2>
        <table class="timeline-table" style="background:white;">
            <tr style="background:#f4f4f4;"><th>項目</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th></tr>
            <tr id="tmRankRow"></tr><tr id="tmSalaryRow"></tr>
        </table>
        <table style="width:100%; text-align:center; border-collapse:collapse;">
            <thead><tr style="background:#f4f4f4; height: 45px;"><th>姓名</th><th>年度</th><th>平均分</th><th>五一</th><th>端午</th><th>中秋</th><th>年終</th><th>專案</th><th>總計額</th></tr></thead>
            <tbody id="resultBody"></tbody>
        </table>
        <div style="display:flex; justify-content:center; gap:20px; margin-top:30px;">
            <button class="btn" style="background:var(--success); padding: 15px 50px; font-size:1.3rem;" onclick="handleFinalSave()">💾 確認並儲存資料</button>
            <button class="btn" style="background:var(--accent); padding: 15px 30px;" onclick="openReport('single')">📄 個人報表</button>
            <button class="btn" style="background:var(--primary); padding: 15px 30px;" onclick="openReport('all')">🌐 全體大表</button>
        </div>
    </div>
    <div class="card">
        <h2>📈 歷年獎金對比 <button class="download-btn" onclick="downloadChart('historyCompareChart', '歷年趨勢對比')">📸 下載JPG</button></h2>
        <div style="height:450px;"><canvas id="historyCompareChart"></canvas></div>
        <div style="height:300px; margin-top:60px;"><canvas id="historyTotalChart"></canvas></div>
    </div>
</div>

<div id="reportModal">
    <div class="report-content">
        <button class="btn no-print" style="position:absolute; top:20px; right:120px; background:#7f8c8d;" onclick="document.getElementById('reportModal').style.display='none'">✖ 關閉</button>
        <button class="btn no-print" style="position:absolute; top:20px; right:20px; background:var(--accent);" onclick="window.print()">🖨️ 列印</button>
        <div id="reportInner"></div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz9kLPJjKS5XZsYmgy_Hk77YKKL7X_8qIJkQrNGyJLEcGb3XKrb0lotAjcNhRCL5EXB/exec"; 
    let scoreChart=null, historyCompareChart=null, historyTotalChart=null, timelineData={}, baseResults={};
    let isUserTyping = false;
    Chart.register(ChartDataLabels);

    window.onload = async () => {
        const res = await fetch(API_URL);
        const r = await res.json();
        document.getElementById('selEmp').innerHTML = r.data.map(e => `<option value="${e.name}" data-rank="${e.rank}" data-salary="${e.salary}">${e.name}</option>`).join('');
        if(sessionStorage.getItem('isAdminUnlocked') === 'true') {
            document.getElementById('adminZone').style.display = 'block';
            document.getElementById('unlockBtn').innerText = "🔓 已授權";
        }
        initUI();
    };

    function initUI() {
        const sel = document.getElementById('selEmp');
        const opt = sel.options[sel.selectedIndex];
        const isL1 = opt.dataset.rank === 'L1';
        let h1 = '', h2 = '';
        for(let i=1; i<=(isL1?12:4); i++) h1 += `<div class="input-group"><span class="input-label">${isL1?i+'月':'Q'+i}</span><input type="number" class="q-score ann-in" oninput="refreshAvgDisplays()"></div>`;
        for(let i=1; i<=12; i++) h2 += `<div class="input-group"><span class="input-label">${i}月</span><input type="number" class="q-score prj-in" oninput="refreshAvgDisplays()"></div>`;
        document.getElementById('annualInputs').innerHTML = h1;
        document.getElementById('projInputs').innerHTML = h2;
        timelineData = { Q1:{r:opt.dataset.rank, s:opt.dataset.salary}, Q2:{r:opt.dataset.rank, s:opt.dataset.salary}, Q3:{r:opt.dataset.rank, s:opt.dataset.salary}, Q4:{r:opt.dataset.rank, s:opt.dataset.salary} };
        autoCalc(true); 
    }

    function refreshAvgDisplays() {
        const getAvg = (cls) => {
            const vals = Array.from(document.querySelectorAll(cls)).map(i => parseFloat(i.value)).filter(v => !isNaN(v));
            return vals.length > 0 ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2) : "0.00";
        };
        document.getElementById('avgSpan').innerText = getAvg('.ann-in');
        document.getElementById('projAvgSpan').innerText = getAvg('.prj-in');
        updateScoreChart();
        clearTimeout(window.calcTimer);
        window.calcTimer = setTimeout(() => autoCalc(false), 800);
    }

    async function autoCalc(forceSync = false) {
        if (isUserTyping && !forceSync) return;
        const payload = { action: "calculateBonus", empName: document.getElementById('selEmp').value, year: document.getElementById('calcYear').value, scores: Array.from(document.querySelectorAll('.ann-in')).map(i => i.value||null), projScores: Array.from(document.querySelectorAll('.prj-in')).map(i => i.value||null), timeline: timelineData, avgScore: document.getElementById('avgSpan').innerText, projAvg: document.getElementById('projAvgSpan').innerText };
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const r = await res.json();
        if(r.status === "success") {
            if(forceSync) {
                if(r.historyScores) document.querySelectorAll('.ann-in').forEach((el,i) => el.value = r.historyScores[i]);
                if(r.historyProjScores) document.querySelectorAll('.prj-in').forEach((el,i) => el.value = r.historyProjScores[i]);
                if(r.historyTimeline) timelineData = r.historyTimeline;
                const getAvg = (cls) => { const vals = Array.from(document.querySelectorAll(cls)).map(i => parseFloat(i.value)).filter(v => !isNaN(v)); return vals.length > 0 ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2) : "0.00"; };
                document.getElementById('avgSpan').innerText = getAvg('.ann-in');
                document.getElementById('projAvgSpan').innerText = getAvg('.prj-in');
            }
            baseResults = r.data;
            renderTimelineUI();
            updateAdminTable(r.historyAdjs || [0,0,0,0,80000,0]);
            updateHistoryCharts();
        }
    }

    function updateAdminTable(adjs) {
        const rb = document.getElementById('resultBody');
        const pCalc = Math.round(parseFloat(adjs[4]) * (baseResults.projMult || 0));
        let pm = 0.5, sc = parseFloat(document.getElementById('avgSpan').innerText);
        if (sc >= 90) pm = 1.5; else if (sc >= 80) pm = 1.3; else if (sc >= 70) pm = 1.0; else if (sc >= 60) pm = 0.7;
        const yeRef = (timelineData.Q4.r === "L1") ? Math.round(parseFloat(timelineData.Q4.s) * pm * 0.5) : baseResults.ye;

        rb.innerHTML = `<tr><td>${document.getElementById('selEmp').value}</td><td>${document.getElementById('calcYear').value}</td><td style="color:blue;font-weight:bold;">${document.getElementById('avgSpan').innerText}</td>
            ${ ['f1','f2','f3'].map((k, i) => `<td><span class="reference-text">試算參考：${baseResults[k]}</span><input type="number" class="target-input" id="target_${k}" value="${Math.round(baseResults[k]+adjs[i])}" oninput="refreshTotal()"></td>`).join('') }
            <td><span class="reference-text">試算參考：${yeRef}</span><input type="number" class="target-input" id="target_ye" value="${Math.round(yeRef+adjs[3])}" oninput="refreshTotal()"></td>
            <td>基數:<input type="number" id="adj_proj_base" value="${adjs[4]}" oninput="refreshTotal()" style="width:70px;"><br><span class="reference-text">試算：${pCalc}</span><input type="number" class="target-input" id="target_proj" value="${Math.round(pCalc+adjs[5])}" oninput="refreshTotal()"></td>
            <td id="totalCell" class="total-cell">0</td></tr>`;
        refreshTotal();
    }

    function renderTimelineUI() {
        let rH = '<td>職等</td>', sH = '<td>月薪</td>';
        ['Q1','Q2','Q3','Q4'].forEach(q => {
            rH += `<td><select onchange="timelineData['${q}'].r=this.value; autoCalc(false)"><option value="L1">L1</option><option value="L2">L2</option><option value="L3">L3</option><option value="L4">L4</option></select></td>`;
            sH += `<td><input type="number" value="${timelineData[q].s}" onfocus="isUserTyping=true" onblur="isUserTyping=false; autoCalc(false)" oninput="timelineData['${q}'].s=this.value" style="width:85px;"></td>`;
        });
        document.getElementById('tmRankRow').innerHTML = rH; document.getElementById('tmSalaryRow').innerHTML = sH;
        document.querySelectorAll('#tmRankRow select').forEach((s,i) => s.value = timelineData['Q'+(i+1)].r);
    }

    function updateScoreChart() {
        const ctx = document.getElementById('scoreChart').getContext('2d');
        if (scoreChart) scoreChart.destroy();
        const ann = Array.from(document.querySelectorAll('.ann-in')).map((i,idx)=>({x:idx+1,y:parseFloat(i.value)}));
        const prj = Array.from(document.querySelectorAll('.prj-in')).map((i,idx)=>({x:idx+1,y:parseFloat(i.value)}));
        scoreChart = new Chart(ctx, { type: 'line', data: { datasets: [{ label: '年度評分', data: ann, borderColor: '#3498db', tension: 0.1 }, { label: '專案評分', data: prj, borderColor: '#e67e22', borderDash: [5,5] }] }, options: { maintainAspectRatio: false, scales: { x: { type: 'linear', min:1, max:12 } }, plugins: { datalabels: { display: true, align:'top', formatter: v => v.y || '' } } } });
    }

    async function updateHistoryCharts() {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getHistoryComparison", empName: document.getElementById('selEmp').value }) });
        const r = await res.json();
        if(r.status === "success" && r.history.length > 0) {
            const ctx1 = document.getElementById('historyCompareChart').getContext('2d');
            if(historyCompareChart) historyCompareChart.destroy();
            historyCompareChart = new Chart(ctx1, { type: 'bar', data: { labels: ['五一','端午','中秋','年終','專案'], datasets: r.history.map((d,i)=>({ label: d.year+'年', data:[d.f1, d.f2, d.f3, d.ye, d.proj], backgroundColor:`rgba(52,152,219,${0.4+(i*0.3)})` })) }, options: { maintainAspectRatio: false, plugins: { datalabels: { display: true, anchor:'end', align:'top' } } } });
            const ctx2 = document.getElementById('historyTotalChart').getContext('2d');
            if(historyTotalChart) historyTotalChart.destroy();
            historyTotalChart = new Chart(ctx2, { type: 'line', data: { labels: r.history.map(d=>d.year+'年'), datasets:[{ label:'總額', data:r.history.map(d=>d.total), borderColor:'#e67e22' }] }, options: { maintainAspectRatio: false, plugins: { datalabels: { display: true, align:'top' } } } });
        }
    }

    async function askPassword() {
        const pwd = prompt("主管授權密碼");
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "verifyAdmin", password: pwd }) });
        if((await res.json()).status === "success") { sessionStorage.setItem('isAdminUnlocked', 'true'); location.reload(); } else alert("錯誤");
    }

    function refreshTotal() {
        let t = 0; ['f1','f2','f3','ye','proj'].forEach(k => { const el = document.getElementById('target_'+k); if(el) t += parseFloat(el.value)||0; });
        document.getElementById('totalCell').innerText = t.toLocaleString();
    }

    async function openReport(mode) {
        const inner = document.getElementById('reportInner');
        const name = document.getElementById('selEmp').value;
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getHistoryComparison", empName: (mode==='all'?"":name) }) });
        const r = await res.json();
        inner.innerHTML = `<h1>${mode==='all'?"全體獎金總表":"個人歷史報表 - "+name}</h1>
            <table class="report-table"><thead><tr><th>年度</th>${mode==='all'?"<th>姓名</th>":""}<th>五一</th><th>端午</th><th>中秋</th><th>年終</th><th>專案</th><th>總計</th></tr></thead>
            <tbody>${r.history.map(h => `<tr><td>${h.year}</td>${mode==='all'?"<td>"+(h.empName||name)+"</td>":""}<td>${h.f1}</td><td>${h.f2}</td><td>${h.f3}</td><td>${h.ye}</td><td>${h.proj}</td><td>${h.total.toLocaleString()}</td></tr>`).join('')}</tbody></table>`;
        document.getElementById('reportModal').style.display = 'block';
    }

    async function handleFinalSave() {
        const getDiff = (id, b) => (parseFloat(document.getElementById(id).value)||0) - (parseFloat(b)||0);
        const data = { action: "saveRecord", year: document.getElementById('calcYear').value, empName: document.getElementById('selEmp').value, total: document.getElementById('totalCell').innerText.replace(/,/g,''), timeline: timelineData, scores: Array.from(document.querySelectorAll('.ann-in')).map(i=>i.value) };
        await fetch(API_URL, { method: "POST", body: JSON.stringify(data) }); alert("✅ 儲存成功！");
    }

    function downloadChart(chartId, bName) {
        const canvas = document.getElementById(chartId);
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/jpeg', 0.9);
        link.download = `${document.getElementById('selEmp').value}_${bName}.jpg`;
        link.click();
    }
</script>
</body>
</html>
