<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>獎金管理系統 - 專案整合旗艦版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; --project: #2980b9; --bg: #f4f7f6; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; position: relative; }
        .header-controls { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; font-size: 1.5rem; font-weight: bold; }
        .score-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; padding: 15px; background: #f8f9fa; border-radius: 10px; border-left: 5px solid var(--primary); }
        .proj-row { border-left-color: var(--project); background: #ebf5fb; }
        .q-score { width: 70px; height: 45px; font-size: 1.3rem; text-align: center; border: 2px solid #ccc; border-radius: 8px; font-weight: bold; }
        .proj-score { border-color: var(--project); }
        .avg-display { min-width: 160px; background: var(--primary); color: white; padding: 12px; border-radius: 8px; text-align: center; margin-left: auto; font-size: 1.2rem; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; }
        .btn-dl { background: #666; font-size: 0.8rem; padding: 5px 10px; position: absolute; top: 10px; right: 10px; z-index: 10; cursor: pointer; color: white; border-radius: 4px; border: none; }
        table { width: 100%; border-collapse: collapse; text-align: center; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; font-size: 1.1rem; }
        .total-cell { font-size: 1.8rem; font-weight: bold; background: #fff3cd; color: #d35400; }
        .chart-box { flex: 1; border: 1px solid #eee; padding: 15px; position: relative; height: 450px; min-width: 400px; }
        .adj-input { width: 90px; color: var(--danger); font-size: 1.2rem; border: 2px dashed var(--danger); text-align: center; border-radius: 4px; }
        .proj-base-input { color: var(--project); border-color: var(--project); border-style: solid; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <button class="btn-dl" onclick="downloadImg('scoreChart', '評分趨勢.png')">📸 下載圖表</button>
    <div class="header-controls">
        員工：<select id="selEmp" onchange="initUI()"></select>
        年度：<input type="number" id="calcYear" value="2025" style="width:120px;" onchange="autoCalc(true)">
        <button class="btn" style="background:var(--danger);" onclick="askPassword()">🔒 主管核定區</button>
    </div>

    <div class="score-row">
        <span style="min-width:100px;">📅 年度評分</span>
        <div id="annualInputs" style="display:flex; gap:8px;"></div>
        <div class="avg-display">年度平均：<span id="avgSpan">0.00</span></div>
    </div>
    
    <div class="score-row proj-row">
        <span style="min-width:100px; color:var(--project);">🚀 專案評分</span>
        <div id="projInputs" style="display:flex; gap:8px;"></div>
        <div class="avg-display" style="background:var(--project);">專案平均：<span id="projAvgSpan">0.00</span></div>
    </div>

    <div style="height:350px; margin-top:15px;"><canvas id="scoreChart"></canvas></div>
</div>

<div id="adminZone" style="display:none;" class="card">
    <h2 style="color:var(--danger)">獎金核定 (含專案與職等變化)</h2>
    <table>
        <thead>
            <tr style="background:#eee;">
                <th>姓名</th><th>年度</th><th>平均分</th>
                <th>五一</th><th>端午</th><th>中秋</th><th>年終</th>
                <th style="color:var(--project);">專案獎金基數調整</th>
                <th>實領總計</th>
            </tr>
        </thead>
        <tbody id="resultBody"></tbody>
    </table>
    
    <div style="display: flex; gap: 20px; margin-top: 20px;">
        <div class="chart-box">
            <button class="btn-dl" onclick="downloadImg('currentYearChart', '當年度分析.png')">📸 下載</button>
            <canvas id="currentYearChart"></canvas>
        </div>
        <div class="chart-box">
            <button class="btn-dl" onclick="downloadImg('historyTrendChart', '歷年趨勢.png')">📸 下載</button>
            <canvas id="historyTrendChart"></canvas>
        </div>
    </div>
    <div style="text-align:right; margin-top:20px;">
        <button id="saveBtn" onclick="handleFinalSave()" class="btn" style="background:var(--success); padding: 15px 50px;">✅ 確認核定存檔</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz9kLPJjKS5XZsYmgy_Hk77YKKL7X_8qIJkQrNGyJLEcGb3XKrb0lotAjcNhRCL5EXB/exec"; 
    let scoreChart=null, currentYearChart=null, historyTrendChart=null, timelineData={}, baseResults={};
    Chart.register(ChartDataLabels);

    window.onload = async () => {
        const res = await fetch(API_URL);
        const r = await res.json();
        document.getElementById('selEmp').innerHTML = r.data.map(e => `<option value="${e.name}" data-rank="${e.rank}" data-salary="${e.salary}">${e.name}</option>`).join('');
        initUI();
    };

    function initUI() {
        const sel = document.getElementById('selEmp');
        const opt = sel.options[sel.selectedIndex];
        const count = opt.dataset.rank === 'L1' ? 12 : 4;
        
        // 生成年度分數框
        let h1 = '';
        for(let i=0; i<count; i++) h1 += `<input type="number" class="q-score ann-in" oninput="localUpdate()">`;
        document.getElementById('annualInputs').innerHTML = h1;

        // 生成專案分數框 (固定 12 個月)
        let h2 = '';
        for(let i=0; i<12; i++) h2 += `<input type="number" class="q-score proj-score prj-in" oninput="localUpdate()">`;
        document.getElementById('projInputs').innerHTML = h2;

        timelineData = { Q1:{r:opt.dataset.rank, s:opt.dataset.salary}, Q2:{r:opt.dataset.rank, s:opt.dataset.salary}, Q3:{r:opt.dataset.rank, s:opt.dataset.salary}, Q4:{r:opt.dataset.rank, s:opt.dataset.salary} };
        autoCalc(true); 
    }

    function localUpdate() {
        const getAvg = (cls) => {
            const vals = Array.from(document.querySelectorAll(cls)).map(i => parseFloat(i.value)).filter(v => !isNaN(v));
            return vals.length > 0 ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2) : "0.00";
        };
        document.getElementById('avgSpan').innerText = getAvg('.ann-in');
        document.getElementById('projAvgSpan').innerText = getAvg('.prj-in');
        
        updateScoreChart();
        clearTimeout(window.calcTimer);
        window.calcTimer = setTimeout(autoCalc, 800);
    }

    async function autoCalc(forceSync = false) {
        const avg = document.getElementById('avgSpan').innerText;
        const prjAvg = document.getElementById('projAvgSpan').innerText;
        const annScores = Array.from(document.querySelectorAll('.ann-in')).map(i => i.value || null);
        const prjScores = Array.from(document.querySelectorAll('.prj-in')).map(i => i.value || null);

        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ 
            action: "calculateBonus", empName: document.getElementById('selEmp').value, 
            year: document.getElementById('calcYear').value, scores: annScores, 
            projScores: prjScores, timeline: timelineData, avgScore: avg, projAvg: prjAvg 
        }) });
        const r = await res.json();
        
        if(r.status === "success") {
            if(forceSync) {
                if(r.historyScores) r.historyScores.forEach((v,i) => { if(document.querySelectorAll('.ann-in')[i]) document.querySelectorAll('.ann-in')[i].value = v; });
                if(r.historyProjScores) JSON.parse(r.historyProjScores).forEach((v,i) => { if(document.querySelectorAll('.prj-in')[i]) document.querySelectorAll('.prj-in')[i].value = v; });
                localUpdate();
            }
            baseResults = r.data;
            const hAdjs = r.historyAdjs || [0,0,0,0,80000,0];
            const projCalc = Math.round(parseFloat(hAdjs[4]) * (baseResults.projMult || 0));

            document.getElementById('resultBody').innerHTML = `
                <tr>
                    <td>${document.getElementById('selEmp').value}</td><td>${document.getElementById('calcYear').value}</td>
                    <td style="font-weight:bold; color:blue;">${avg}</td>
                    ${ ['f1','f2','f3','ye'].map((k, i) => `<td><small style="color:green;font-weight:bold">${baseResults[k] || 0}</small><br><input type="number" class="adj-input" id="adj_${k}" value="${hAdjs[i]}" oninput="refreshCharts()"></td>`).join('') }
                    <td>
                        <small>基數調整：</small><input type="number" class="adj-input proj-base-input" id="adj_proj_base" value="${hAdjs[4]}" oninput="refreshCharts()">
                        <br><small style="color:var(--project)">試算: ${projCalc.toLocaleString()}</small>
                        <br><small>加減：</small><input type="number" class="adj-input" id="adj_proj_val" value="${hAdjs[5] || 0}" oninput="refreshCharts()" style="border-style:dotted;">
                    </td>
                    <td id="totalCell" class="total-cell">0</td>
                </tr>`;
            refreshCharts();
        }
    }

    function refreshCharts() {
        let t = 0;
        ['f1', 'f2', 'f3', 'ye'].forEach(k => { t += (baseResults[k] || 0) + (parseFloat(document.getElementById('adj_' + k).value) || 0); });
        
        const pBase = parseFloat(document.getElementById('adj_proj_base').value) || 0;
        const pAdj = parseFloat(document.getElementById('adj_proj_val').value) || 0;
        const projFinal = Math.round(pBase * (baseResults.projMult || 0)) + pAdj;
        
        document.getElementById('totalCell').innerText = (t + projFinal).toLocaleString();
        if(document.getElementById('adminZone').style.display === 'block') { updateCurrentYearChart(); updateHistoryTrendChart(); }
    }

    function updateScoreChart() {
        const ctx = document.getElementById('scoreChart').getContext('2d');
        if (scoreChart) scoreChart.destroy();
        const annData = Array.from(document.querySelectorAll('.ann-in')).map(i => parseFloat(i.value));
        const prjData = Array.from(document.querySelectorAll('.prj-in')).map(i => parseFloat(i.value));

        scoreChart = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: Array.from({length:12}, (_,i)=>i+1), 
                datasets: [
                    { label: '年度評分', data: annData, borderColor: '#3498db', tension: 0.3, pointRadius: 5 },
                    { label: '專案評分', data: prjData, borderColor: '#e67e22', tension: 0.3, pointRadius: 5, borderDash: [5, 5] }
                ] 
            },
            options: { 
                maintainAspectRatio: false,
                plugins: { datalabels: { align: 'top', offset: 5, font: { weight: 'bold' }, formatter: v => isNaN(v) ? '' : v } }
            }
        });
    }

    function updateCurrentYearChart() {
        const ctx = document.getElementById('currentYearChart').getContext('2d');
        if (currentYearChart) currentYearChart.destroy();
        const pBase = parseFloat(document.getElementById('adj_proj_base').value) || 0;
        const pAdj = parseFloat(document.getElementById('adj_proj_val').value) || 0;
        const projFinal = Math.round(pBase * (baseResults.projMult || 0)) + pAdj;

        currentYearChart = new Chart(ctx, {
            type: 'bar',
            data: { 
                labels: ['五一', '端午', '中秋', '年終', '專案'], 
                datasets: [
                    { 
                        label: '公式/基數', 
                        data: ['f1','f2','f3','ye'].map(k => baseResults[k]).concat([Math.round(pBase * (baseResults.projMult || 0))]), 
                        backgroundColor: ['#27ae60', '#27ae60', '#27ae60', '#27ae60', '#2980b9'], stack: 'S' 
                    },
                    { 
                        label: '手動調整', 
                        data: ['f1','f2','f3','ye'].map(k => parseFloat(document.getElementById('adj_'+k).value)||0).concat([pAdj]), 
                        backgroundColor: '#e74c3c', stack: 'S' 
                    }
                ]
            },
            options: { maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
        });
    }

    async function updateHistoryTrendChart() {
        try {
            const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getHistoryTrend", empName: document.getElementById('selEmp').value }) });
            const r = await res.json();
            const ctx = document.getElementById('historyTrendChart').getContext('2d');
            if (historyTrendChart) historyTrendChart.destroy();
            historyTrendChart = new Chart(ctx, {
                type: 'line',
                data: { labels: r.trend.map(t => t.year), datasets: [{ label: '歷年總額', data: r.trend.map(t => t.total), borderColor: '#f39c12', fill: true }] },
                options: { maintainAspectRatio: false }
            });
        } catch(e) {}
    }

    async function handleFinalSave() {
        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        const data = {
            action: "saveRecord", year: document.getElementById('calcYear').value, empName: document.getElementById('selEmp').value,
            rank: timelineData.Q4.r, avgScore: document.getElementById('avgSpan').innerText,
            f1_base: baseResults.f1, f1_adj: parseFloat(document.getElementById('adj_f1').value)||0,
            f2_base: baseResults.f2, f2_adj: parseFloat(document.getElementById('adj_f2').value)||0,
            f3_base: baseResults.f3, f3_adj: parseFloat(document.getElementById('adj_f3').value)||0,
            ye_base: baseResults.ye, ye_adj: parseFloat(document.getElementById('adj_ye').value)||0,
            proj_final_base: parseFloat(document.getElementById('adj_proj_base').value)||0,
            proj_adj: parseFloat(document.getElementById('adj_proj_val').value)||0,
            total: document.getElementById('totalCell').innerText.replace(/,/g, ''),
            scores: Array.from(document.querySelectorAll('.ann-in')).map(i => i.value || null),
            projScores: Array.from(document.querySelectorAll('.prj-in')).map(i => i.value || null),
            timeline: timelineData
        };
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(data) });
        if((await res.json()).status === "success") alert("✅ 核定存檔成功！");
        btn.disabled = false;
    }

    function askPassword() { if(prompt("主管密碼")==="0000") { document.getElementById('adminZone').style.display='block'; refreshCharts(); } }
    function downloadImg(id, name) { const l = document.createElement('a'); l.href = document.getElementById(id).toDataURL(); l.download = name; l.click(); }
</script>
</body>
</html>
