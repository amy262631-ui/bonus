<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>獎金管理系統 - 專案與職等整合版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; --bg: #f4f7f6; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; position: relative; }
        .header-controls { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; font-size: 1.5rem; font-weight: bold; }
        .score-container { display: flex; flex-wrap: wrap; gap: 10px; background: #eef2f7; padding: 20px; border-radius: 12px; }
        .q-score { width: 75px; height: 50px; font-size: 1.4rem; text-align: center; border-radius: 8px; border: 2px solid #ccc; font-weight: bold; }
        .avg-display { background: var(--primary); color: white; padding: 15px 25px; border-radius: 10px; font-size: 1.5rem; margin-left: auto; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; }
        .btn-dl { background: #666; font-size: 0.8rem; padding: 5px 10px; position: absolute; top: 10px; right: 10px; z-index: 10; cursor: pointer; color: white; border-radius: 4px; border: none; }
        table { width: 100%; border-collapse: collapse; text-align: center; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; font-size: 1.1rem; }
        .total-cell { font-size: 1.8rem; font-weight: bold; background: #fff3cd; color: #d35400; }
        .chart-box { flex: 1; border: 1px solid #eee; padding: 10px; position: relative; height: 400px; }
        .adj-input { width: 90px; color: var(--danger); font-size: 1.2rem; border: 2px dashed var(--danger); text-align: center; border-radius: 4px; }
    </style>
</head>
<body>

<div class="card">
    <button class="btn-dl" onclick="downloadImg('scoreChart', '評分趨勢.png')">📸 下載</button>
    <div class="header-controls">
        員工：<select id="selEmp" onchange="initUI()"></select>
        年度：<input type="number" id="calcYear" value="2025" style="width:120px;" onchange="autoCalc(true)">
        <button class="btn" style="background:var(--danger);" onclick="askPassword()">🔒 主管核定區</button>
    </div>
    <div id="scoreInputs" class="score-container"></div>
    <div style="height:350px; margin-top:15px;"><canvas id="scoreChart"></canvas></div>
</div>

<div id="adminZone" style="display:none;" class="card">
    <h2 style="color:var(--danger)">獎金核定 (含專案獎金與職等變化)</h2>
    <table>
        <thead>
            <tr style="background:#eee;">
                <th>姓名</th><th>年度</th><th>平均分</th>
                <th>五一</th><th>端午</th><th>中秋</th><th>年終</th>
                <th style="color:blue;">專案獎金</th>
                <th>實領總計</th>
            </tr>
        </thead>
        <tbody id="resultBody"></tbody>
    </table>
    
    <div style="display: flex; gap: 20px; margin-top: 20px;">
        <div class="chart-box">
            <button class="btn-dl" onclick="downloadImg('currentYearChart', '當年度獎金分析.png')">📸 下載</button>
            <canvas id="currentYearChart"></canvas>
        </div>
        <div class="chart-box">
            <button class="btn-dl" onclick="downloadImg('historyTrendChart', '歷年獎金趨勢.png')">📸 下載</button>
            <canvas id="historyTrendChart"></canvas>
        </div>
    </div>
    <div style="text-align:right; margin-top:20px;">
        <button onclick="handleFinalSave()" class="btn" style="background:var(--success); padding: 15px 50px;">✅ 確認核定存檔</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz9kLPJjKS5XZsYmgy_Hk77YKKL7X_8qIJkQrNGyJLEcGb3XKrb0lotAjcNhRCL5EXB/exec"; 
    let scoreChart=null, currentYearChart=null, historyTrendChart=null, timelineData={}, baseResults={};
    Chart.register(ChartDataLabels);

    window.onload = async () => {
        const res = await fetch(API_URL);
        const r = await res.json();
        document.getElementById('selEmp').innerHTML = r.data.map(e => `<option value="${e.name}" data-rank="${e.rank}" data-salary="${e.salary}">${e.name}</option>`).join('');
        initUI();
    };

    function initUI() {
        const sel = document.getElementById('selEmp');
        const opt = sel.options[sel.selectedIndex];
        const count = opt.dataset.rank === 'L1' ? 12 : 4;
        let html = '';
        for(let i=0; i<count; i++) html += `<div><small>${i+1}</small><br><input type="number" class="q-score" oninput="localUpdate()"></div>`;
        html += `<div class="avg-display">年度平均：<span id="avgSpan">0.00</span></div>`;
        document.getElementById('scoreInputs').innerHTML = html;
        // 初始化四季 Timeline 資料
        timelineData = { 
            Q1:{r:opt.dataset.rank, s:opt.dataset.salary}, 
            Q2:{r:opt.dataset.rank, s:opt.dataset.salary}, 
            Q3:{r:opt.dataset.rank, s:opt.dataset.salary}, 
            Q4:{r:opt.dataset.rank, s:opt.dataset.salary} 
        };
        autoCalc(true); 
    }

    function localUpdate() {
        const inputs = Array.from(document.querySelectorAll('.q-score'));
        const scores = inputs.map(i => i.value==="" ? null : parseFloat(i.value));
        const valid = scores.filter(v => v !== null && !isNaN(v));
        const avg = valid.length > 0 ? (valid.reduce((a,b)=>a+b,0)/valid.length).toFixed(2) : "0.00";
        document.getElementById('avgSpan').innerText = avg;
        updateScoreChart(inputs, scores);
        clearTimeout(window.calcTimer);
        window.calcTimer = setTimeout(autoCalc, 800);
    }

    async function autoCalc(forceSync = false) {
        const avgScore = document.getElementById('avgSpan').innerText;
        const inputs = document.querySelectorAll('.q-score');
        if (forceSync) inputs.forEach(i => i.value = "");
        const scores = Array.from(inputs).map(i => i.value === "" ? null : i.value);
        
        const res = await fetch(API_URL, { 
            method: "POST", 
            body: JSON.stringify({ action: "calculateBonus", empName: document.getElementById('selEmp').value, year: document.getElementById('calcYear').value, scores, timeline: timelineData, avgScore }) 
        });
        const r = await res.json();
        
        if(r.status === "success") {
            if(r.historyScores && (forceSync || Array.from(inputs).every(i => i.value === ""))) {
                r.historyScores.forEach((v, i) => { if (v !== null && inputs[i]) inputs[i].value = v; });
                localUpdate();
            }
            baseResults = r.data;
            const hAdjs = r.historyAdjs || [0,0,0,0,0]; // 五個位置包含專案調整
            
            document.getElementById('resultBody').innerHTML = `
                <tr>
                    <td>${document.getElementById('selEmp').value}</td>
                    <td>${document.getElementById('calcYear').value}</td>
                    <td style="font-weight:bold; color:blue; font-size:1.5rem;">${avgScore}</td>
                    ${ ['f1','f2','f3','ye'].map((k, i) => `
                        <td>
                            <small style="color:green;font-weight:bold">${baseResults[k] || 0}</small><br>
                            <input type="number" class="adj-input" id="adj_${k}" value="${hAdjs[i]}" oninput="refreshCharts()">
                        </td>`).join('') 
                    }
                    <td>
                        <small style="color:blue;font-weight:bold">${baseResults.proj || 0}</small><br>
                        <input type="number" class="adj-input" id="adj_proj" value="${hAdjs[4] || 0}" oninput="refreshCharts()">
                    </td>
                    <td id="totalCell" class="total-cell">0</td>
                </tr>`;
            refreshCharts();
        }
    }

    function refreshCharts() {
        let t = 0;
        // 計算常規獎金
        ['f1','f2','f3','ye'].forEach(k => { 
            t += (baseResults[k] || 0) + (parseFloat(document.getElementById('adj_'+k).value) || 0); 
        });
        // 加上專案獎金
        t += (baseResults.proj || 0) + (parseFloat(document.getElementById('adj_proj').value) || 0);

        document.getElementById('totalCell').innerText = t.toLocaleString();
        
        if(document.getElementById('adminZone').style.display === 'block') { 
            updateCurrentYearChart(); 
            updateHistoryTrendChart(); 
        }
    }

    function updateScoreChart(inputs, scores) {
        const ctx = document.getElementById('scoreChart').getContext('2d');
        if (scoreChart) scoreChart.destroy();
        scoreChart = new Chart(ctx, {
            type: 'line',
            data: { labels: inputs.map((_,i)=>i+1), datasets: [{ label: '評分趨勢', data: scores, borderColor: '#3498db', tension: 0.3, pointRadius: 5 }] },
            options: { 
                maintainAspectRatio: false,
                plugins: {
                    datalabels: { align: 'top', offset: 5, font: { weight: 'bold' }, formatter: v => v === null ? '' : v }
                }
            }
        });
    }

    function updateCurrentYearChart() {
        const ctx = document.getElementById('currentYearChart').getContext('2d');
        if (currentYearChart) currentYearChart.destroy();
        currentYearChart = new Chart(ctx, {
            type: 'bar',
            data: { 
                labels: ['五一', '端午', '中秋', '年終', '專案'], 
                datasets: [
                    { 
                        label: '公式金額', 
                        data: ['f1','f2','f3','ye'].map(k => baseResults[k]).concat([baseResults.proj || 0]), 
                        backgroundColor: '#27ae60', stack: 'S' 
                    },
                    { 
                        label: '手動調整', 
                        data: ['f1','f2','f3','ye'].map(k => parseFloat(document.getElementById('adj_'+k).value)||0).concat([parseFloat(document.getElementById('adj_proj').value)||0]), 
                        backgroundColor: '#e74c3c', stack: 'S' 
                    }
                ]
            },
            options: { 
                maintainAspectRatio: false, 
                scales: { x: { stacked: true }, y: { stacked: true } },
                plugins: { datalabels: { anchor: 'center', color: 'white' } }
            }
        });
    }

    async function updateHistoryTrendChart() {
        try {
            const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getHistoryTrend", empName: document.getElementById('selEmp').value }) });
            const r = await res.json();
            const ctx = document.getElementById('historyTrendChart').getContext('2d');
            if (historyTrendChart) historyTrendChart.destroy();
            historyTrendChart = new Chart(ctx, {
                type: 'line',
                data: { labels: r.trend.map(t => t.year), datasets: [{ label: '歷年總額', data: r.trend.map(t => t.total), borderColor: '#f39c12', fill: true }] },
                options: { maintainAspectRatio: false }
            });
        } catch(e) { console.error("趨勢圖載入失敗"); }
    }

    async function handleFinalSave() {
        if(!confirm("確定要核定存檔嗎？")) return;
        const btn = event.target;
        btn.disabled = true;

        const scores = Array.from(document.querySelectorAll('.q-score')).map(i => i.value === "" ? null : parseFloat(i.value));
        const data = {
            action: "saveRecord",
            year: document.getElementById('calcYear').value,
            empName: document.getElementById('selEmp').value,
            rank: timelineData.Q4.r,
            avgScore: document.getElementById('avgSpan').innerText,
            f1_base: baseResults.f1, f1_adj: parseFloat(document.getElementById("adj_f1").value) || 0,
            f2_base: baseResults.f2, f2_adj: parseFloat(document.getElementById("adj_f2").value) || 0,
            f3_base: baseResults.f3, f3_adj: parseFloat(document.getElementById("adj_f3").value) || 0,
            ye_base: baseResults.ye, ye_adj: parseFloat(document.getElementById("adj_ye").value) || 0,
            proj_base: baseResults.proj || 0, proj_adj: parseFloat(document.getElementById("adj_proj").value) || 0,
            total: document.getElementById('totalCell').innerText.replace(/,/g, ''),
            scores: scores,
            timeline: timelineData
        };

        try {
            const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(data) });
            const r = await res.json();
            if(r.status === "success") alert("✅ 核定存檔成功！");
            else alert("❌ 存檔失敗：" + r.msg);
        } catch(e) { alert("❌ 網路錯誤，存檔失敗"); }
        finally { btn.disabled = false; }
    }

    function askPassword() { if(prompt("主管密碼")==="0000") { document.getElementById('adminZone').style.display='block'; refreshCharts(); } }
    function downloadImg(id, name) { const l = document.createElement('a'); l.href = document.getElementById(id).toDataURL('image/png'); l.download = name; l.click(); }
</script>
</body>
</html>
