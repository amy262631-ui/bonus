<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>獎金管理系統 - 全功能優化版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
    /* 1. 系統主介面樣式 */
    :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; --project: #e67e22; --bg: #f4f7f6; }
    body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); padding: 20px; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 25px; }
    .header-controls { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; }
    #selEmp, #calcYear { padding: 8px 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 1.1rem; }
    
    /* 評分輸入框優化 */
    .score-container { display: flex; flex-direction: column; gap: 10px; padding: 15px; background: #f8f9fa; border-radius: 10px; border-left: 8px solid var(--primary); margin-bottom: 15px; }
    .score-grid { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .input-group { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .input-label { font-size: 0.85rem; color: #666; font-weight: bold; }
    .q-score { width: 65px; height: 35px; text-align: center; font-size: 1rem; border: 1px solid #ddd; border-radius: 6px; font-weight: bold; padding: 0 4px; }

    .avg-display { min-width: 150px; background: var(--primary); color: white; padding: 10px; border-radius: 8px; text-align: center; margin-left: auto; font-size: 1.1rem; font-weight: bold; }
    
    .target-label { color: var(--danger); font-weight: bold; font-size: 0.9rem; margin-bottom: 2px; display: block; }
    .target-input { width: 105px; height: 40px; color: var(--danger); font-size: 1.35rem; border: 2px solid var(--danger); text-align: center; font-weight: bold; background: #fff5f5; border-radius: 6px; }
    
    .reference-text { color: #27ae60; font-weight: bold; font-size: 0.85rem; display: block; margin-bottom: 2px; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
    .total-cell { font-size: 2.2rem; font-weight: bold; background: #fff3cd; color: #d35400; min-width: 150px; }
    
    /* 2. 報表視窗與內容基礎 */
    #reportModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; overflow-y: auto; padding: 40px 20px; }
    .report-content { background: white; max-width: 1100px; margin: 0 auto; padding: 40px; border-radius: 15px; position: relative; }

    .report-page { background: white; page-break-after: always; }
    .excel-report { width: 100%; border-collapse: collapse; margin-bottom: 30px; table-layout: fixed; }
    .excel-report th, .excel-report td { border: 1px solid #000 !important; padding: 8px 4px; font-size: 13px; word-break: break-all; }
    .excel-report th { background-color: #e8e8e8 !important; font-weight: bold; text-align: center; }
    .excel-report td { text-align: right; }
    .excel-report td:first-child { text-align: center; }

    .report-charts { margin-top: 30px; display: flex; flex-direction: column; gap: 40px; }
    .chart-box { width: 100%; height: 380px; text-align: center; margin-bottom: 50px; padding: 20px; border: 1px solid #eee; }

    /* 3. 平板與手機端的響應式優化 (新增) */
    @media (max-width: 1024px) {
        .header-controls { flex-wrap: wrap; justify-content: flex-start; }
        .card { padding: 15px; }
        .score-grid { justify-content: flex-start; }
        .avg-display { margin-left: 0; margin-top: 10px; width: 100%; }
        
        /* 讓核定區表格在平板上可以水平滑動，不會擠壓內容 */
        #adminZone .card { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        #adminZone table { min-width: 850px; } 
    }
    
    /* 4. 列印優化與分頁 */
    @media print {
        body { padding: 0 !important; background: white !important; }
        body * { visibility: hidden; }
        #reportModal, #reportModal * { visibility: visible; }
        #reportModal { position: absolute; left: 0; top: 0; width: 100%; background: white !important; padding: 0 !important; }
        .report-content { box-shadow: none !important; border-radius: 0 !important; width: 100% !important; max-width: none !important; margin: 0 !important; padding: 0 !important; }
        .no-print { display: none !important; }
        .report-page { height: 285mm; padding: 10mm; box-sizing: border-box; display: flex; flex-direction: column; }
        .excel-report th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .chart-box { page-break-inside: avoid; }
    }
</style>
</head>
<body>

<div class="card">
    <div class="header-controls">
        <span>👤 人員：</span><select id="selEmp" onchange="initUI()"></select>
        <span>📅 年度：</span><input type="number" id="calcYear" value="2025" onchange="autoCalc(true)">
        <button class="btn" style="background:var(--success);" onclick="handleFinalSave()">💾 儲存數據</button>
        <button id="unlockBtn" class="btn" style="background:var(--danger); margin-left:auto;" onclick="askPassword()">🔒 主管授權</button>
    </div>

    <div class="score-container">
        <div style="font-weight:bold; color:var(--primary);">🗓️ 年度績效評分</div>
        <div id="annualInputs" class="score-grid"></div>
        <div class="avg-display" style="margin-top:10px;">年度平均：<span id="avgSpan">0.00</span></div>
    </div>

    <div class="score-container" style="border-left-color: var(--project); background: #fdf5e6;">
        <div style="font-weight:bold; color:var(--project);">🚀 專案表現評分</div>
        <div id="projInputs" class="score-grid"></div>
        <div class="avg-display" style="background:var(--project); margin-top:10px;">專案平均：<span id="projAvgSpan">0.00</span></div>
    </div>
    
    <h2>📊 綜合趨勢圖 <button class="download-btn" style="background:#7f8c8d; padding:6px; font-size:0.8rem; color:white; border-radius:4px; border:none; cursor:pointer;" onclick="downloadChart('scoreChart', '綜合趨勢')">📸 下載</button></h2>
    <div style="height:350px;"><canvas id="scoreChart"></canvas></div>
</div>

<div id="adminZone" style="display:none;">
    <div class="card" style="border: 2px solid var(--danger);">
        <h2 style="color:var(--danger);">主管獎金核定 (年份排序與專案金額修正版)</h2>
        <table style="width:100%; border-collapse:collapse; margin-bottom:20px; border:1px solid #ddd;">
            <tr style="background:#f4f4f4;"><th>項目</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th></tr>
            <tr id="tmRankRow"></tr><tr id="tmSalaryRow"></tr>
        </table>
        <table style="width:100%; text-align:center; border-collapse:collapse;">
            <thead><tr style="background:#f4f4f4; height: 45px;"><th>姓名</th><th>年度</th><th>平均分</th><th>五一</th><th>端午</th><th>中秋</th><th>年終</th><th>專案</th><th>總計額</th></tr></thead>
            <tbody id="resultBody"></tbody>
        </table>
        <div style="display:flex; justify-content:center; gap:15px; margin-top:30px;">
            <button class="btn" style="background:var(--success); padding: 15px 40px; font-size:1.2rem;" onclick="handleFinalSave()">💾 確認並儲存</button>
            <button class="btn" style="background:var(--accent); padding: 15px 30px;" onclick="openReport('single')">📄 個人報表</button>
            <button class="btn" style="background:var(--primary); padding: 15px 30px;" onclick="openReport('all')">🌐 全體總表</button>
        </div>
    </div>
    <div class="card">
    <h2>📈 歷年獎金對比 (雙色長條圖) <button class="download-btn" onclick="downloadChart('historyCompareChart', '歷年對比')">📸 下載</button></h2>
    <div style="height:350px;"><canvas id="historyCompareChart"></canvas></div>
    
    <hr style="margin: 40px 0; border: 0; border-top: 1px solid #eee;"> <h2>📈 歷年總獎金成長趨勢 (折線圖) <button class="download-btn" onclick="downloadChart('historyTrendChart', '總額趨勢')">📸 下載</button></h2>
    <div style="height:350px;"><canvas id="historyTrendChart"></canvas></div>
</div>
</div>

<div id="reportModal">
    <div class="report-content">
        <button class="btn no-print" style="position:absolute; top:20px; right:120px; background:#7f8c8d;" onclick="document.getElementById('reportModal').style.display='none'">✖ 關閉</button>
        <button class="btn no-print" style="position:absolute; top:20px; right:20px; background:var(--accent);" onclick="window.print()">🖨️ 列印</button>
        <div id="reportInner"></div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz9kLPJjKS5XZsYmgy_Hk77YKKL7X_8qIJkQrNGyJLEcGb3XKrb0lotAjcNhRCL5EXB/exec"; 
    let scoreChart=null, historyCompareChart=null, timelineData={}, baseResults={};
    let isUserTyping = false; Chart.register(ChartDataLabels);

    window.onload = async () => {
        const res = await fetch(API_URL);
        const r = await res.json();
        document.getElementById('selEmp').innerHTML = r.data.map(e => `<option value="${e.name}" data-rank="${e.rank}" data-salary="${e.salary}">${e.name}</option>`).join('');
        initUI();
    };

    function initUI() {
    const sel = document.getElementById('selEmp');
    const opt = sel.options[sel.selectedIndex];
    const isL1 = opt.dataset.rank === 'L1';
    
    // 💡 核心修正：換人時先徹底重設 timelineData，防止抓到上一人的職等薪資
    timelineData = { 
        Q1:{r:opt.dataset.rank, s:opt.dataset.salary}, 
        Q2:{r:opt.dataset.rank, s:opt.dataset.salary}, 
        Q3:{r:opt.dataset.rank, s:opt.dataset.salary}, 
        Q4:{r:opt.dataset.rank, s:opt.dataset.salary} 
    };

    let h1 = '', h2 = '';
    for(let i=1; i<=(isL1?12:4); i++) h1 += `<div class="input-group"><span class="input-label">${isL1?i+'月':'Q'+i}</span><input type="number" class="q-score ann-in" oninput="runLiveCalc()"></div>`;
    for(let i=1; i<=12; i++) h2 += `<div class="input-group"><span class="input-label">${i}月</span><input type="number" class="q-score prj-in" oninput="runLiveCalc()"></div>`;
    
    document.getElementById('annualInputs').innerHTML = h1; 
    document.getElementById('projInputs').innerHTML = h2;
    
    autoCalc(true); // 執行自動載入
}

    function runLiveCalc() {
        const getAvg = (cls) => {
            const vals = Array.from(document.querySelectorAll(cls)).map(i => parseFloat(i.value)).filter(v => !isNaN(v));
            return vals.length > 0 ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2) : "0.00";
        };
        document.getElementById('avgSpan').innerText = getAvg('.ann-in');
        document.getElementById('projAvgSpan').innerText = getAvg('.prj-in');
        updateScoreChart();
        updateAdminTableUI(); 
    }

    async function autoCalc(forceSync = false) {
    if (isUserTyping && !forceSync) return;

    // 💡 核心修正：在讀取新年度/新人員資料前，先清空畫面上所有輸入框
    if(forceSync) {
        document.querySelectorAll('.ann-in, .prj-in').forEach(i => i.value = "");
        if(document.getElementById('resultBody')) {
            document.getElementById('resultBody').innerHTML = ""; // 先清空主管區
        }
    }

    const payload = { 
        action: "calculateBonus", 
        empName: document.getElementById('selEmp').value, 
        year: document.getElementById('calcYear').value, 
        scores: Array.from(document.querySelectorAll('.ann-in')).map(i => i.value||null), 
        timeline: timelineData, 
        avgScore: document.getElementById('avgSpan').innerText, 
        projAvg: document.getElementById('projAvgSpan').innerText 
    };

    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    const r = await res.json();
        
    if(r.status === "success") {
        // 💡 重點：把後端傳來的年度參數存進 baseResults，讓計算公式可以抓到
        baseResults = r.data;
        baseResults.yearConfigs = r.yearConfigs; // <-- 新增這一行

        if(forceSync) {
            // ... 填充歷史分數邏輯 ...
            runLiveCalc(); 
        }
        renderTimelineUI();
        updateAdminTableUI(r.historyAdjs || [0,0,0,0,80000,0]);
        updateHistoryCharts();
    }

 function updateAdminTableUI(adjs = null) {
    const cfg = baseResults.yearConfigs || {};
    const rb = document.getElementById('resultBody');
    if (!rb) return;

    // 💡 讀取這筆資料在資料庫中的「總額」存檔 (這才是真正的歷史發放金額)
    // 假設我們在後端回傳時已經有 historyTotal 或是從 baseResults 取得
    const savedTotal = baseResults.historyTotal || 0; 
    const isHistory = adjs && adjs.some((val, idx) => (idx !== 4 && val !== 0) || (idx === 4 && val !== 80000));

    const calcRef = (q, idx) => {
        const r = timelineData[q].r;
        const s = parseFloat(timelineData[q].s);
        if (r === "L1") return parseFloat(cfg.L1_Fest_Over_6M || 1000);
        const baseKey = `${r}_Base`;
        const base = parseFloat(cfg[baseKey] || (r === "L2" ? 0.7 : (r === "L3" ? 1.0 : 1.5)));
        const qScore = parseFloat(document.querySelectorAll('.ann-in')[idx]?.value || 0);
        return Math.round(s * 0.25 * base * getPerfMult_Frontend(qScore, "quarterly"));
    };

    let html = `<tr><td>${document.getElementById('selEmp').value}</td><td>${document.getElementById('calcYear').value}</td><td style="color:blue;font-weight:bold;">${document.getElementById('avgSpan').innerText}</td>`;
    
    const items = ['f1', 'f2', 'f3', 'ye', 'proj'];
    items.forEach((item, i) => {
        let ref = 0;
        let displayVal = 0;

        // 計算當前公式下的「參考值」
        if (item === 'proj') {
            const projBase = adjs ? adjs[4] : (cfg.Project_Total || 80000);
            const projMult = getProjectMultiplier_Frontend(document.getElementById('projAvgSpan').innerText);
            ref = Math.round(projBase * projMult);
        } else if (item === 'ye') {
            const q4Rank = timelineData.Q4.r;
            const s = parseFloat(timelineData.Q4.s);
            const yeBase = (q4Rank === "L1") ? parseFloat(cfg.L1_Over_1Y || 0.5) : parseFloat(cfg[`${q4Rank}_Base`] || 1.0);
            ref = Math.round(s * yeBase * getPerfMult_Frontend(document.getElementById('avgSpan').innerText, "annual"));
        } else {
            ref = calcRef("Q" + (i + 1), i);
        }

        // 💡 核心邏輯修正：如果是歷史資料，定案獎金直接讀取「當時存好的定案金額」
        // 我們假設儲存時已經把定案金額存在某些欄位，如果沒有，就用 ref + adj
        // 為了確保不跳動，我們這裡直接計算出結果
        if (item === 'proj') {
            displayVal = ref + (adjs ? adjs[5] : 0);
        } else if (item === 'ye') {
            displayVal = ref + (adjs ? adjs[3] : 0);
        } else {
            displayVal = ref + (adjs ? adjs[i] : 0);
        }

        html += `<td>
            <span class="reference-text" id="ref_${item}">${item==='proj'?'試算':'參考'}:${ref.toLocaleString()}</span>
            <span class="target-label">定案獎金：</span>
            <input type="number" class="target-input" id="target_${item}" 
                   value="${displayVal}" 
                   oninput="refreshTotal()">
        </td>`;
    });

    html += `<input type="hidden" id="adj_proj_base" value="${adjs ? adjs[4] : 80000}">`;
    html += `<td id="totalCell" class="total-cell">0</td></tr>`;
    
    rb.innerHTML = html;
    refreshTotal();
}

    function renderTimelineUI() {
        let rH = '<td>職等</td>', sH = '<td>月薪</td>';
        ['Q1','Q2','Q3','Q4'].forEach(q => {
            rH += `<td><select onchange="timelineData['${q}'].r=this.value; runLiveCalc()"><option value="L1">L1</option><option value="L2">L2</option><option value="L3">L3</option><option value="L4">L4</option></select></td>`;
            sH += `<td><input type="number" value="${timelineData[q].s}" onfocus="isUserTyping=true" onblur="isUserTyping=false; runLiveCalc()" oninput="timelineData['${q}'].s=this.value" style="width:80px;"></td>`;
        });
        document.getElementById('tmRankRow').innerHTML = rH; document.getElementById('tmSalaryRow').innerHTML = sH;
        document.querySelectorAll('#tmRankRow select').forEach((s,i) => s.value = timelineData['Q'+(i+1)].r);
    }

    function updateScoreChart() {
        const ctx = document.getElementById('scoreChart').getContext('2d'); if (scoreChart) scoreChart.destroy();
        const annVals = Array.from(document.querySelectorAll('.ann-in')).map(i => parseFloat(i.value));
        const prjVals = Array.from(document.querySelectorAll('.prj-in')).map(i => parseFloat(i.value));
        const annData = annVals.length === 4 ? [{x:3, y:annVals[0]}, {x:6, y:annVals[1]}, {x:9, y:annVals[2]}, {x:12, y:annVals[3]}] : annVals.map((v, i) => ({x: i+1, y: v}));
        const prjData = prjVals.map((v, i) => ({x: i+1, y: v}));
        scoreChart = new Chart(ctx, { type: 'line', data: { datasets: [{ label: '年度評分', data: annData, borderColor: '#3498db', backgroundColor:'transparent', fill: false, tension: 0.1, pointRadius: 5 }, { label: '專案評分', data: prjData, borderColor: '#e67e22', borderDash: [5,5], tension: 0.3 } ]}, options: { maintainAspectRatio: false, scales: { x: { type: 'linear', min:1, max:12, ticks: { stepSize: 1, callback: v => v + '月' } } }, plugins: { datalabels: { display: true, align:'top', formatter: v => v.y || '' } } } });
    }

   let historyTrendChart = null; // 在最上方定義變數，防止重複渲染

async function updateHistoryCharts() {
    const res = await fetch(API_URL, { 
        method: "POST", 
        body: JSON.stringify({ action: "getHistoryComparison", empName: document.getElementById('selEmp').value }) 
    });
    const r = await res.json();
    
    if(r.status === "success" && r.history.length > 0) {
        const sortedHistory = r.history.sort((a, b) => a.year - b.year);
        const labels = sortedHistory.map(d => d.year + '年');
        const ctx1 = document.getElementById('historyCompareChart').getContext('2d');
        if(historyCompareChart) historyCompareChart.destroy();

        // 改回單純設計：每一種獎金為一個獨立數據集
        historyCompareChart = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: '五一', data: sortedHistory.map(d => Number(d.f1 || 0)), backgroundColor: '#3498db' }, // 藍色
                    { label: '端午', data: sortedHistory.map(d => Number(d.f2 || 0)), backgroundColor: '#2980b9' },
                    { label: '中秋', data: sortedHistory.map(d => Number(d.f3 || 0)), backgroundColor: '#1f618d' },
                    { label: '年終', data: sortedHistory.map(d => Number(d.ye || 0)), backgroundColor: '#27ae60' },
                    { label: '專案', data: sortedHistory.map(d => Number(d.proj || 0)), backgroundColor: '#e67e22' }
                ]
            },
            options: {
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top' },
                    datalabels: { 
                        display: true, anchor: 'end', align: 'top', 
                        formatter: (v, ctx) => {
                            // 僅在最頂層顯示該年度總計
                            if (ctx.datasetIndex === ctx.chart.data.datasets.length - 1) {
                                let total = 0;
                                for(let i=0; i<ctx.chart.data.datasets.length; i++) {
                                    total += Number(ctx.chart.data.datasets[i].data[ctx.dataIndex] || 0);
                                }
                                return '總計:' + total.toLocaleString();
                            }
                            return null;
                        },
                        font: { weight: 'bold' }
                    }
                },
                scales: { 
                    x: { stacked: true }, 
                    y: { stacked: true, beginAtZero: true } 
                }
            }
        });

        // 同步渲染下方的「歷年總獎金趨勢 (折線圖)」
        renderTrendChart(labels, sortedHistory.map(d => Number(d.total || 0)));
    }
}

// 獨立出來的折線圖函式，確保代碼乾淨
function renderTrendChart(labels, data) {
    const ctx2 = document.getElementById('historyTrendChart').getContext('2d');
    if(window.historyTrendChartInstance) window.historyTrendChartInstance.destroy();
    window.historyTrendChartInstance = new Chart(ctx2, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: '歷年總獎金成長趨勢',
                data: data,
                borderColor: '#e74c3c',
                borderWidth: 3,
                fill: false,
                tension: 0.1,
                pointRadius: 6,
                pointBackgroundColor: '#e74c3c'
            }]
        },
        options: {
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'top' },
                datalabels: { display: true, align: 'top', formatter: v => v.toLocaleString() }
            },
            scales: { y: { beginAtZero: true } }
        }
    });
}

    async function askPassword() {
        const pwd = prompt("主管授權密碼");
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "verifyAdmin", password: pwd }) });
        const r = await res.json();
        if(r.status === "success") { document.getElementById('adminZone').style.display = 'block'; document.getElementById('unlockBtn').innerText = "🔓 已授權"; autoCalc(false); } else alert("密碼錯誤");
    }

    function refreshTotal() {
        let t = 0; ['target_f1','target_f2','target_f3','target_ye','target_proj'].forEach(id => { const el = document.getElementById(id); if(el) t += parseFloat(el.value)||0; });
        document.getElementById('totalCell').innerText = t.toLocaleString();
    }

    async function openReport(mode) {
        const inner = document.getElementById('reportInner');
        const name = document.getElementById('selEmp').value;
        const payload = mode === 'all' ? { action: "getHistoryComparison" } : { action: "getHistoryComparison", empName: name };
        try {
            const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
            const r = await res.json();
            if (mode === 'all') {
                const grouped = r.history.reduce((acc, curr) => { if (!acc[curr.year]) acc[curr.year] = []; acc[curr.year].push(curr); return acc; }, {});
                const sortedYears = Object.keys(grouped).sort((a, b) => a - b);
                let fullHtml = "";
                for (let i = 0; i < sortedYears.length; i += 3) {
                    const pageYears = sortedYears.slice(i, i + 3);
                    fullHtml += `<div class="report-page">`;
                    pageYears.forEach(year => {
                        fullHtml += `<h2 style="text-align:center; margin: 10px 0;">${year} 年度全體獎金總結表</h2><table class="excel-report"><thead><tr><th style="width:15%;">姓名</th><th style="width:10%;">五一</th><th style="width:10%;">端午</th><th style="width:10%;">中秋</th><th style="width:10%;">年終</th><th style="width:10%;">專案</th><th style="width:12%;">總計</th><th style="width:23%;">調整/備註 (空白手寫)</th></tr></thead><tbody>${grouped[year].map(h => `<tr><td>${h.empName}</td><td>${h.f1.toLocaleString()}</td><td>${h.f2.toLocaleString()}</td><td>${h.f3.toLocaleString()}</td><td>${h.ye.toLocaleString()}</td><td>${h.proj.toLocaleString()}</td><td style="font-weight:bold;">${h.total.toLocaleString()}</td><td></td></tr>`).join('')}</tbody></table>`;
                    });
                    fullHtml += `</div>`;
                }
                inner.innerHTML = fullHtml;
            } else {
                let html = `<div class="report-page"><h2 style="text-align:center; margin-bottom: 20px;">${name} - 歷年獎金績效明細報告</h2><table class="excel-report"><thead><tr><th style="width:15%;">年度</th><th>五一</th><th>端午</th><th>中秋</th><th>年終</th><th>專案</th><th style="width:15%;">總計</th><th style="width:20%;">手寫備註</th></tr></thead><tbody>${r.history.sort((a,b)=>a.year-b.year).map(h => `<tr><td style="text-align:center;">${h.year}</td><td>${h.f1.toLocaleString()}</td><td>${h.f2.toLocaleString()}</td><td>${h.f3.toLocaleString()}</td><td>${h.ye.toLocaleString()}</td><td>${h.proj.toLocaleString()}</td><td style="font-weight:bold;">${h.total.toLocaleString()}</td><td></td></tr>`).join('')}</tbody></table><div class="report-charts"><div class="chart-box"><h3>🏆 歷年獎金組成分析 (長條圖)</h3><canvas id="printBarChart"></canvas></div><div class="chart-box"><h3>📈 歷年總獎金趨勢 (折線圖)</h3><canvas id="printLineChart"></canvas></div></div></div>`;
                inner.innerHTML = html;
                setTimeout(() => { renderReportCharts(r.history); }, 500);
            }
            document.getElementById('reportModal').style.display = 'block';
        } catch (err) { alert("報表生成錯誤"); }
    }

    function renderReportCharts(data) {
    const canvasBar = document.getElementById('printBarChart');
    const canvasLine = document.getElementById('printLineChart');
    
    if (!canvasBar || !canvasLine) return;

    const ctxBar = canvasBar.getContext('2d');
    const ctxLine = canvasLine.getContext('2d'); // 💡 確保折線圖畫布被正確抓取
    
    const sortedData = data.sort((a, b) => a.year - b.year);
    const labels = sortedData.map(d => d.year + "年");

    // --- 長條圖：顏色說明移至左側 ---
    new Chart(ctxBar, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                { label: '三節', data: sortedData.map(d => d.f1 + d.f2 + d.f3), backgroundColor: '#3498db' },
                { label: '年終', data: sortedData.map(d => d.ye), backgroundColor: '#27ae60' },
                { label: '專案', data: sortedData.map(d => d.proj), backgroundColor: '#e67e22' }
            ]
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false,
            layout: { padding: { top: 40 } },
            plugins: { 
                legend: { position: 'left' }, // 💡 移至左側，不再遮擋上方金額
                datalabels: { display: true, anchor: 'end', align: 'top', font: { weight: 'bold' } }
            },
            scales: { y: { beginAtZero: true, stacked: false } }
        }
    });

    // --- 折線圖：重新啟動趨勢顯示 ---
    new Chart(ctxLine, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: '總獎金成長趨勢',
                data: sortedData.map(d => d.total),
                borderColor: '#e74c3c',
                borderWidth: 3,
                fill: false,
                tension: 0.1,
                pointRadius: 6,
                pointBackgroundColor: '#e74c3c'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            layout: { padding: { top: 30 } },
            plugins: {
                legend: { position: 'left' },
                datalabels: { display: true, align: 'top' }
            },
            scales: { y: { beginAtZero: true } }
        }
    });
}

    async function handleFinalSave() {
    // 💡 輔助函式：只抓取標籤內的數字，過濾掉「試算參考：」或逗號
    const getNumFromLabel = (id) => {
        const el = document.getElementById(id);
        if (!el) return 0;
        // 使用正則表達式只保留數字、負號與小數點
        return parseFloat(el.innerText.replace(/[^0-9.-]+/g, "")) || 0;
    };

    const refF1 = getNumFromLabel('ref_f1');
    const refF2 = getNumFromLabel('ref_f2');
    const refF3 = getNumFromLabel('ref_f3');
    const refYe = getNumFromLabel('ref_ye');
    const refProj = getNumFromLabel('ref_proj');

    // 💡 自動回推調整項 (定案獎金 - 參考值)
    const data = { 
        action: "saveRecord", 
        year: document.getElementById('calcYear').value, 
        empName: document.getElementById('selEmp').value, 
        rank: timelineData.Q4.r, 
        avgScore: document.getElementById('avgSpan').innerText, 
        
        // 儲存當下的底碼
        f1_base: refF1, 
        f2_base: refF2, 
        f3_base: refF3, 
        ye_base: refYe, 
        proj_final_base: document.getElementById('adj_proj_base').value, 
        
        // 儲存回推後的差額 (調整項)
        f1_adj: parseFloat(document.getElementById('target_f1').value) - refF1, 
        f2_adj: parseFloat(document.getElementById('target_f2').value) - refF2, 
        f3_adj: parseFloat(document.getElementById('target_f3').value) - refF3, 
        ye_adj: parseFloat(document.getElementById('target_ye').value) - refYe, 
        proj_adj: parseFloat(document.getElementById('target_proj').value) - refProj, 
        
        total: document.getElementById('totalCell').innerText.replace(/,/g,''), 
        timeline: timelineData, 
        scores: Array.from(document.querySelectorAll('.ann-in')).map(i=>i.value), 
        projScores: Array.from(document.querySelectorAll('.prj-in')).map(i=>i.value) 
    };

    try {
        await fetch(API_URL, { method: "POST", body: JSON.stringify(data) });
        alert("✅ 儲存成功！歷史發放金額已鎖定。");
        updateHistoryCharts();
    } catch (err) {
        alert("❌ 儲存失敗，請檢查網路連線。");
        console.error(err);
    }
}

    function downloadChart(chartId, bName) {
        const canvas = document.getElementById(chartId); const link = document.createElement('a');
        link.href = canvas.toDataURL('image/jpeg', 0.9); link.download = `${document.getElementById('selEmp').value}_${bName}.jpg`; link.click();
    }
</script>
