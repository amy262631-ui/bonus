<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>獎金管理系統 - 主管優化版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; --project: #2980b9; --bg: #f4f7f6; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 25px; position: relative; }
        .header-controls { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; font-size: 1.2rem; }
        #selEmp, #calcYear { padding: 8px 15px; font-size: 1.2rem; border-radius: 8px; border: 1px solid #ccc; }
        .score-container { display: flex; flex-direction: column; gap: 10px; padding: 15px; background: #f8f9fa; border-radius: 10px; border-left: 8px solid var(--primary); margin-bottom: 15px; }
        .score-grid { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
        .input-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .input-label { font-size: 0.85rem; color: #666; font-weight: bold; }
        .q-score { width: 65px; height: 45px; text-align: center; font-size: 1.3rem; font-weight: bold; border: 2px solid #ddd; border-radius: 6px; }
        .avg-display { min-width: 160px; background: var(--primary); color: white; padding: 12px; border-radius: 8px; text-align: center; margin-left: auto; font-size: 1.1rem; }
        .target-input { width: 110px; height: 45px; color: var(--danger); font-size: 1.3rem; border: 2px solid var(--danger); text-align: center; font-weight: bold; background: #fff5f5; border-radius: 6px; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; font-size: 1.1rem; transition: 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .timeline-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 1.1rem; }
        .timeline-table th, .timeline-table td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        .total-cell { font-size: 2.2rem; font-weight: bold; background: #fff3cd; color: #d35400; }
        h2 { border-left: 8px solid var(--accent); padding-left: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .download-btn { background: #7f8c8d; padding: 5px 12px; font-size: 0.85rem; border-radius: 6px; color: white; cursor: pointer; border: none; font-weight: normal; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-controls">
        <span>👤 人員：</span><select id="selEmp" onchange="initUI()"></select>
        <span>📅 年度：</span><input type="number" id="calcYear" value="2025" onchange="autoCalc(true)">
        <button class="btn" style="background:var(--accent);" onclick="handleFinalSave()">💾 存檔</button>
        <button class="btn" style="background:var(--danger); margin-left:auto;" onclick="askPassword()">🔒 主管解鎖 (核定/歷年)</button>
    </div>

    <div class="score-container">
        <div style="font-weight:bold; color:var(--primary);">🗓️ 年度績效評分</div>
        <div class="score-grid">
            <div id="annualInputs" style="display:flex; gap:8px;"></div>
            <div class="avg-display">年度平均：<span id="avgSpan">0.00</span></div>
        </div>
    </div>
    
    <h2>📊 評分趨勢圖 <button class="download-btn" onclick="downloadChart('scoreChart', '績效分數趨勢.jpg')">📸 下載JPG</button></h2>
    <div style="height:350px;"><canvas id="scoreChart"></canvas></div>
</div>

<div id="adminZone" style="display:none;">
    <div class="card">
        <h2 style="color:var(--danger); border-left-color:var(--danger)">主管獎金核定</h2>
        <table class="timeline-table" style="background:white;">
            <tr style="background:#f4f4f4;"><th>項目</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th></tr>
            <tr id="tmRankRow"></tr><tr id="tmSalaryRow"></tr>
        </table>
        <table style="width:100%; text-align:center; border-collapse:collapse; font-size:1.1rem;">
            <thead><tr style="background:#f4f4f4;"><th>姓名</th><th>年度</th><th>平均分</th><th>五一</th><th>端午</th><th>中秋</th><th>年終</th><th>專案基數/核定</th><th>總計</th></tr></thead>
            <tbody id="resultBody"></tbody>
        </table>
        <div style="height:400px; margin-top:20px;"><canvas id="currentYearChart"></canvas></div>
    </div>

    <div class="card">
        <h2>📈 歷年獎金對照 <button class="download-btn" onclick="downloadChart('historyCompareChart', '歷年獎金對照.jpg')">📸 下載JPG</button></h2>
        <div style="height:500px; padding-top: 20px;"><canvas id="historyCompareChart"></canvas></div>
        <div style="height:350px; margin-top:60px;"><canvas id="historyTotalChart"></canvas></div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz9kLPJjKS5XZsYmgy_Hk77YKKL7X_8qIJkQrNGyJLEcGb3XKrb0lotAjcNhRCL5EXB/exec"; 
    let scoreChart=null, currentYearChart=null, historyCompareChart=null, historyTotalChart=null, timelineData={}, baseResults={};
    let isUserTyping = false;
    Chart.register(ChartDataLabels);

    window.onload = async () => {
        const res = await fetch(API_URL);
        const r = await res.json();
        document.getElementById('selEmp').innerHTML = r.data.map(e => `<option value="${e.name}" data-rank="${e.rank}" data-salary="${e.salary}">${e.name}</option>`).join('');
        initUI();
    };

    function initUI() {
        document.getElementById('adminZone').style.display = 'none';
        const sel = document.getElementById('selEmp');
        const opt = sel.options[sel.selectedIndex];
        const isL1 = opt.dataset.rank === 'L1';
        let h1 = '';
        const count = isL1 ? 12 : 4;
        for(let i=1; i<=count; i++) {
            h1 += `<div class="input-group"><span class="input-label">${isL1?i+'月':'Q'+i}</span><input type="number" class="q-score ann-in" oninput="localUpdate()"></div>`;
        }
        document.getElementById('annualInputs').innerHTML = h1;

        let h2 = '';
        for(let i=1; i<=12; i++) {
            h2 += `<div class="input-group"><span class="input-label">${i}月</span><input type="number" class="q-score prj-in" oninput="localUpdate()"></div>`;
        }
        document.getElementById('projInputs').innerHTML = h2;

        timelineData = { Q1:{r:opt.dataset.rank, s:opt.dataset.salary}, Q2:{r:opt.dataset.rank, s:opt.dataset.salary}, Q3:{r:opt.dataset.rank, s:opt.dataset.salary}, Q4:{r:opt.dataset.rank, s:opt.dataset.salary} };
        autoCalc(true); 
    }

    function localUpdate() {
        refreshAvgDisplays();
        clearTimeout(window.calcTimer);
        window.calcTimer = setTimeout(autoCalc, 800);
    }

    function refreshAvgDisplays() {
        const getAvg = (cls) => {
            const vals = Array.from(document.querySelectorAll(cls)).map(i => parseFloat(i.value)).filter(v => !isNaN(v));
            return vals.length > 0 ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2) : "0.00";
        };
        document.getElementById('avgSpan').innerText = getAvg('.ann-in');
        document.getElementById('projAvgSpan').innerText = getAvg('.prj-in');
        updateScoreChart();
    }

    async function autoCalc(forceSync = false) {
        if (isUserTyping && !forceSync) return;
        const payload = { 
            action: "calculateBonus", 
            empName: document.getElementById('selEmp').value, 
            year: document.getElementById('calcYear').value, 
            scores: Array.from(document.querySelectorAll('.ann-in')).map(i => i.value||null), 
            projScores: Array.from(document.querySelectorAll('.prj-in')).map(i => i.value||null), 
            timeline: timelineData, 
            avgScore: document.getElementById('avgSpan').innerText, 
            projAvg: document.getElementById('projAvgSpan').innerText 
        };
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const r = await res.json();
        if(r.status === "success") {
            if(forceSync) {
                if(r.historyScores) {
                    const annInputs = document.querySelectorAll('.ann-in');
                    r.historyScores.forEach((v,i) => { if(annInputs[i]) annInputs[i].value = v; });
                }
                if(r.historyProjScores) {
                    const prjInputs = document.querySelectorAll('.prj-in');
                    r.historyProjScores.forEach((v,i) => { if(prjInputs[i]) prjInputs[i].value = v; });
                }
                if(r.historyTimeline) timelineData = r.historyTimeline;
                refreshAvgDisplays();
            }
            baseResults = r.data;
            renderTimelineUI();
            updateAdminTable(r.historyAdjs);
        }
    }

    function updateAdminTable(historyAdjs) {
        const adjs = historyAdjs || [0,0,0,0,80000,0];
        const pMult = parseFloat(baseResults.projMult) || 0;
        const pCalc = (pMult > 0) ? Math.round(parseFloat(adjs[4]) * pMult) : 0;
        const getVal = (i, b) => Math.round((parseFloat(b)||0) + (parseFloat(adjs[i])||0));
        const rb = document.getElementById('resultBody');
        rb.innerHTML = `<tr>
            <td>${document.getElementById('selEmp').value}</td>
            <td>${document.getElementById('calcYear').value}</td>
            <td style="color:blue;font-weight:bold;font-size:1.2rem;">${document.getElementById('avgSpan').innerText}</td>
            ${ ['f1','f2','f3','ye'].map((k, i) => `<td>
                <small style="color:green; font-weight:bold;">試算參考：${baseResults[k]||0}</small><br>
                <span style="font-size:0.75rem; color:red;">最終發放金額:</span><br>
                <input type="number" class="target-input" id="target_${k}" value="${getVal(i, baseResults[k])}" oninput="refreshTotal()">
            </td>`).join('') }
            <td>
                專案基數:<input type="number" id="adj_proj_base" value="${adjs[4]}" oninput="refreshTotal()" style="width:85px; font-size:1.1rem;"><br>
                <small style="color:${pCalc > 0 ? 'black' : 'red'}; font-weight:bold;">試算：${pCalc.toLocaleString()}</small><br>
                <span style="font-size:0.75rem; color:red;">最終發放金額:</span><br>
                <input type="number" class="target-input" id="target_proj" value="${pCalc > 0 ? getVal(5, pCalc) : 0}" oninput="refreshTotal()">
            </td>
            <td id="totalCell" class="total-cell">0</td>
        </tr>`;
        refreshTotal();
    }

    function renderTimelineUI() {
        let rH = '<td>職等</td>', sH = '<td>月薪</td>';
        ['Q1','Q2','Q3','Q4'].forEach(q => {
            rH += `<td><select onchange="timelineData['${q}'].r=this.value;autoCalc(false)" style="font-size:1rem; padding:4px;"><option value="L1">L1</option><option value="L2">L2</option><option value="L3">L3</option><option value="L4">L4</option></select></td>`;
            sH += `<td><input type="number" value="${timelineData[q].s}" onfocus="isUserTyping=true" onblur="isUserTyping=false;autoCalc(false)" oninput="timelineData['${q}'].s=this.value" style="width:85px; font-size:1.1rem; padding:4px;"></td>`;
        });
        document.getElementById('tmRankRow').innerHTML = rH; document.getElementById('tmSalaryRow').innerHTML = sH;
        document.querySelectorAll('#tmRankRow select').forEach((s,i) => s.value = timelineData['Q'+(i+1)].r);
    }

    async function updateHistoryCharts() {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getHistoryComparison", empName: document.getElementById('selEmp').value }) });
        const r = await res.json();
        if(r.status === "success" && r.history.length > 0) {
            const ctx1 = document.getElementById('historyCompareChart').getContext('2d');
            if(historyCompareChart) historyCompareChart.destroy();
            historyCompareChart = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: ['五一', '端午', '中秋', '年終', '專案'],
                    datasets: r.history.map((d, i) => ({
                        label: d.year + ' 年',
                        data: [d.f1, d.f2, d.f3, d.ye, d.proj],
                        backgroundColor: `rgba(52, 152, 219, ${0.4 + (i*0.3)})`,
                        borderColor: '#2980b9', borderWidth: 1
                    }))
                },
                options: { maintainAspectRatio: false, layout: { padding: { top: 65 } }, plugins: { datalabels: { display: true, anchor: 'end', align: 'top', font: { weight: 'bold' }, color: '#c0392b', formatter: (v) => v > 0 ? v.toLocaleString() : '' } } }
            });

            // 2. 優化折線圖 (解決 2023-2025 擁擠問題)
            const ctx2 = document.getElementById('historyTotalChart').getContext('2d');
            if(historyTotalChart) historyTotalChart.destroy();
            historyTotalChart = new Chart(ctx2, {
                type: 'line',
                data: {
                    labels: r.history.map(d => d.year + '年度'),
                    datasets: [{ label: '總額', data: r.history.map(d => d.total), borderColor: '#e67e22', pointRadius: 10, fill: false }]
                },
                options: {
                    maintainAspectRatio: false,
                    layout: { padding: { top: 60, left: 50, right: 50, bottom: 30 } }, // 加大左右邊距
                    plugins: {
                        datalabels: {
                            display: true, align: 'top', offset: 15,
                            font: { weight: 'bold', size: 16 }, color: '#d35400',
                            formatter: v => '領：' + v.toLocaleString()
                        }
                    },
                    scales: {
                        x: { ticks: { font: { size: 14, weight: 'bold' }, padding: 10 } },
                        y: { display: false } // 隱藏 Y 軸讓視覺更水平開闊
                    }
                }
            });
        }
    }

    function downloadChart(chartId, filename) {
        const canvas = document.getElementById(chartId);
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/jpeg', 1.0);
        link.download = filename;
        link.click();
    }

    function refreshTotal() {
        let t = 0;
        ['f1', 'f2', 'f3', 'ye', 'proj'].forEach(k => {
            const el = document.getElementById('target_' + k);
            if (el) t += parseFloat(el.value) || 0;
        });
        document.getElementById('totalCell').innerText = t.toLocaleString();
        if (document.getElementById('adminZone').style.display === 'block') updateAdminCharts();
    }

    function updateScoreChart() {
        const ctx = document.getElementById('scoreChart').getContext('2d');
        if (scoreChart) scoreChart.destroy();
        const annRaw = Array.from(document.querySelectorAll('.ann-in')).map(i => parseFloat(i.value));
        let annMapped = annRaw.length === 4 ? [{x:3,y:annRaw[0]},{x:6,y:annRaw[1]},{x:9,y:annRaw[2]},{x:12,y:annRaw[3]}] : annRaw.map((v,i)=>({x:i+1,y:v}));
        scoreChart = new Chart(ctx, {
            type: 'line',
            data: { datasets: [{ label: '年度評分', data: annMapped, borderColor: '#3498db', backgroundColor:'white' }, { label: '專案評分', data: Array.from(document.querySelectorAll('.prj-in')).map((i,idx)=>({x:idx+1,y:parseFloat(i.value)})), borderColor: '#e67e22', borderDash:[5,5] }]},
            options: { maintainAspectRatio: false, scales: { x: { type: 'linear', min:1, max:12, ticks:{stepSize:1} } }, plugins: { datalabels: { display: true, align:'top', formatter: v => v.y || '' } } }
        });
    }

    async function handleFinalSave() {
        const getDiff = (id, b) => (parseFloat(document.getElementById(id).value)||0) - (parseFloat(b)||0);
        const pCalc = Math.round(parseFloat(document.getElementById('adj_proj_base').value) * (baseResults.projMult || 0));
        const data = {
            action: "saveRecord", year: document.getElementById('calcYear').value, empName: document.getElementById('selEmp').value,
            rank: timelineData.Q4.r, avgScore: document.getElementById('avgSpan').innerText,
            f1_base: baseResults.f1, f1_adj: getDiff('target_f1', baseResults.f1),
            f2_base: baseResults.f2, f2_adj: getDiff('target_f2', baseResults.f2),
            f3_base: baseResults.f3, f3_adj: getDiff('target_f3', baseResults.f3),
            ye_base: baseResults.ye, ye_adj: getDiff('target_ye', baseResults.ye),
            proj_final_base: parseFloat(document.getElementById('adj_proj_base').value),
            proj_adj: getDiff('target_proj', pCalc),
            total: document.getElementById('totalCell').innerText.replace(/,/g, ''),
            scores: Array.from(document.querySelectorAll('.ann-in')).map(i => i.value||null),
            projScores: Array.from(document.querySelectorAll('.prj-in')).map(i => i.value||null),
            timeline: timelineData
        };
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(data) });
        if((await res.json()).status === "success") { alert("✅ 存檔成功！"); updateHistoryCharts(); }
    }

    async function askPassword() {
        const pwd = prompt("主管授權密碼");
        if(!pwd) return;
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "verifyAdmin", password: pwd }) });
        const r = await res.json();
        if(r.status === "success") { document.getElementById('adminZone').style.display = 'block'; autoCalc(false); updateHistoryCharts(); } else { alert("密碼錯誤！"); }
    }

    function updateAdminCharts() {
        const ctx = document.getElementById('currentYearChart').getContext('2d');
        if (currentYearChart) currentYearChart.destroy();
        const pCalc = Math.round(parseFloat(document.getElementById('adj_proj_base').value) * (baseResults.projMult || 0));
        currentYearChart = new Chart(ctx, {
            type: 'bar',
            data: { 
                labels: ['五一','端午','中秋','年終','專案'], 
                datasets: [
                    { label: '試算參考', data: [baseResults.f1, baseResults.f2, baseResults.f3, baseResults.ye, pCalc], backgroundColor: '#27ae60', stack: 'A' },
                    { label: '手動調整', data: ['f1','f2','f3','ye'].map(k => getDiffForChart(k)).concat([ (parseFloat(document.getElementById('target_proj').value) || 0) - pCalc ]), backgroundColor: '#e74c3c', stack: 'A' }
                ]
            },
            options: { maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } }, plugins: { datalabels: { display: false } } }
        });
    }
    function getDiffForChart(k) {
        const el = document.getElementById('target_' + k);
        return el ? ((parseFloat(el.value) || 0) - (baseResults[k]||0)) : 0;
    }
</script>
</body>
</html>
