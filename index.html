<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>獎金管理系統 - 動態回填修正版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; --bg: #f4f7f6; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .header-controls { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; font-size: 1.4rem; font-weight: bold; }
        select, input { font-size: 1.3rem; padding: 8px; border: 2px solid var(--accent); border-radius: 8px; }
        .score-container { display: flex; flex-wrap: wrap; gap: 8px; background: #eef2f7; padding: 15px; border-radius: 12px; }
        .q-score { width: 70px; height: 45px; font-size: 1.3rem; text-align: center; border-radius: 6px; border: 2px solid #ccc; }
        .avg-display { background: var(--primary); color: white; padding: 12px 20px; border-radius: 8px; font-size: 1.4rem; margin-left: auto; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-controls">
        員工：<select id="selEmp" onchange="initUI()"></select>
        年度：<input type="number" id="calcYear" value="2025" style="width:110px;" onchange="autoCalc()">
        <button class="btn" style="background:#888;" onclick="clearScores()">🧹 清除</button>
        <button class="btn" style="background:var(--accent);" onclick="handleSaveScores()">💾 暫存分數</button>
        <button class="btn" style="background:var(--danger);" id="unlockBtn" onclick="askPassword()">🔒 主管核定</button>
    </div>
    <div id="scoreInputs" class="score-container"></div>
    <div style="height:250px; margin-top:15px;"><canvas id="scoreChart"></canvas></div>
</div>

<div id="adminZone" style="display:none;">
    <div class="card">
        <h2 style="color:var(--danger)">核定區 (綠色公式 + 紅色調整)</h2>
        <table id="resultTable" style="width:100%; border-collapse:collapse; text-align:center;">
            <thead><tr style="background:#eee;"><th>姓名</th><th>年度</th><th>平均分</th><th>五一</th><th>端午</th><th>中秋</th><th>年終</th><th>實領總計</th></tr></thead>
            <tbody id="resultBody"></tbody>
        </table>
        <div style="text-align:right; margin-top:20px;">
            <button onclick="handleFinalSave()" class="btn" style="background:var(--success); padding: 15px 40px;">✅ 確認核定存檔</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz9kLPJjKS5XZsYmgy_Hk77YKKL7X_8qIJkQrNGyJLEcGb3XKrb0lotAjcNhRCL5EXB/exec";
    let scoreChart = null, timelineData = {}, baseResults = {};

    window.onload = async () => {
        const res = await fetch(API_URL);
        const r = await res.json();
        document.getElementById('selEmp').innerHTML = r.data.map(e => `<option value="${e.name}" data-rank="${e.rank}" data-salary="${e.salary}">${e.name}</option>`).join('');
        initUI();
    };

    function initUI() {
        const sel = document.getElementById('selEmp');
        const opt = sel.options[sel.selectedIndex];
        const count = opt.dataset.rank === 'L1' ? 12 : 4;
        let html = '';
        for(let i=0; i<count; i++) html += `<div><small>${i+1}</small><br><input type="number" class="q-score" oninput="localUpdate()"></div>`;
        html += `<div class="avg-display">平均：<span id="avgSpan">0.00</span></div>`;
        document.getElementById('scoreInputs').innerHTML = html;
        timelineData = { Q1:{r:opt.dataset.rank, s:opt.dataset.salary}, Q2:{r:opt.dataset.rank, s:opt.dataset.salary}, Q3:{r:opt.dataset.rank, s:opt.dataset.salary}, Q4:{r:opt.dataset.rank, s:opt.dataset.salary} };
        autoCalc(true); // 強制讀取歷史
    }

    function localUpdate() {
        const inputs = Array.from(document.querySelectorAll('.q-score'));
        const scores = inputs.map(i => i.value==="" ? null : parseFloat(i.value));
        const valid = scores.filter(v => v !== null && !isNaN(v));
        document.getElementById('avgSpan').innerText = valid.length > 0 ? (valid.reduce((a,b)=>a+b,0)/valid.length).toFixed(2) : "0.00";
        updateScoreChart(inputs, scores);
        clearTimeout(window.calcTimer);
        window.calcTimer = setTimeout(autoCalc, 800);
    }

    async function autoCalc(forceHistory = false) {
        const inputs = document.querySelectorAll('.q-score');
        const scores = Array.from(inputs).map(i => i.value === "" ? null : i.value);
        
        const res = await fetch(API_URL, { 
            method: "POST", 
            body: JSON.stringify({ action: "calculateBonus", empName: document.getElementById('selEmp').value, year: document.getElementById('calcYear').value, scores, timeline: timelineData }) 
        });
        const r = await res.json();
        
        if(r.status === "success") {
            // 如果是切換人員或年度 (forceHistory)，且畫面上沒數字，才回填
            if(forceHistory && r.historyScores) {
                r.historyScores.forEach((v, i) => { if (v !== null && inputs[i]) inputs[i].value = v; });
                localUpdate(); // 重新畫圖
            }
            const finalAvg = r.data.avgScore;
            baseResults = r.data;
            const hAdjs = r.historyAdjs || [0,0,0,0];
            document.getElementById('resultBody').innerHTML = `
                <tr>
                    <td>${document.getElementById('selEmp').value}</td><td>${document.getElementById('calcYear').value}</td>
                    <td style="font-weight:bold; color:blue;">${finalAvg}</td>
                    ${['f1','f2','f3','ye'].map((k,i)=> `<td><small style="color:green">${baseResults[k]}</small><br><input type="number" class="adj-input" id="adj_${k}" value="${hAdjs[i]}" style="width:70px; color:red" oninput="refreshTotal()"></td>`).join('')}
                    <td id="totalCell" style="font-weight:bold; background:#fff3cd;">0</td>
                </tr>`;
            refreshTotal();
        }
    }

    function refreshTotal() {
        let t = 0;
        ['f1','f2','f3','ye'].forEach(k => { t += (baseResults[k]||0) + (parseFloat(document.getElementById('adj_'+k).value)||0); });
        document.getElementById('totalCell').innerText = t.toLocaleString();
    }

    async function handleSaveScores() {
        const scores = Array.from(document.querySelectorAll('.q-score')).map(i => i.value === "" ? null : parseFloat(i.value));
        await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "saveScoresOnly", year: document.getElementById('calcYear').value, empName: document.getElementById('selEmp').value, scores }) });
        alert("✅ 分數暫存成功");
    }

    function updateScoreChart(inputs, scores) {
        const ctx = document.getElementById('scoreChart').getContext('2d');
        if (scoreChart) scoreChart.destroy();
        scoreChart = new Chart(ctx, { type: 'line', data: { labels: inputs.map((_,i)=>i+1), datasets: [{ label: '評分', data: scores, borderColor: '#3498db', tension: 0.3 }] }, options: { maintainAspectRatio: false } });
    }
    function askPassword() { if(prompt("密碼")==="0000") document.getElementById('adminZone').style.display='block'; }
    function clearScores() { document.querySelectorAll('.q-score').forEach(i=>i.value=""); localUpdate(); }
</script>
</body>
</html>
