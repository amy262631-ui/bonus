<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>獎金管理系統 - 目標金額調整版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; --project: #2980b9; --bg: #f4f7f6; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; position: relative; }
        .header-controls { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; font-weight: bold; }
        .score-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 12px; background: #f8f9fa; border-radius: 10px; border-left: 5px solid var(--primary); }
        .proj-row { border-left-color: var(--project); background: #ebf5fb; }
        .q-score { width: 65px; height: 40px; font-size: 1.2rem; text-align: center; border: 2px solid #ccc; border-radius: 6px; font-weight: bold; }
        .avg-display { min-width: 150px; background: var(--primary); color: white; padding: 10px; border-radius: 8px; text-align: center; margin-left: auto; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; }
        .timeline-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .timeline-table th, .timeline-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        .total-cell { font-size: 1.8rem; font-weight: bold; background: #fff3cd; color: #d35400; }
        .target-input { width: 100px; color: var(--danger); font-size: 1.1rem; border: 2px solid var(--danger); text-align: center; font-weight: bold; background: #fff5f5; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-controls">
        人員：<select id="selEmp" onchange="initUI()"></select>
        年度：<input type="number" id="calcYear" value="2025" style="width:100px;" onchange="autoCalc(true)">
        <button class="btn" style="background:var(--accent);" onclick="handleFinalSave()">💾 快速存檔</button>
        <button class="btn" style="background:var(--danger); margin-left:auto;" onclick="askPassword()">🔒 主管核定區</button>
    </div>

    <div class="score-row">
        <span>📅 年度評分</span>
        <div id="annualInputs" style="display:flex; gap:5px;"></div>
        <div class="avg-display">年度平均：<span id="avgSpan">0.00</span></div>
    </div>
    
    <div class="score-row proj-row">
        <span style="color:var(--project);">🚀 專案評分</span>
        <div id="projInputs" style="display:flex; gap:5px;"></div>
        <div class="avg-display" style="background:var(--project);">專案平均：<span id="projAvgSpan">0.00</span></div>
    </div>

    <div style="height:350px; margin-top:15px;"><canvas id="scoreChart"></canvas></div>
</div>

<div id="adminZone" style="display:none;" class="card">
    <h2 style="color:var(--danger)">獎金核定區 (目標金額輸入模式)</h2>
    
    <div style="background:#eee; padding:15px; border-radius:10px; margin-bottom:20px;">
        <h4 style="margin-top:0;">📊 年度職等薪資異動 (Timeline)</h4>
        <table class="timeline-table" style="background:white;">
            <tr style="background:#f4f4f4;"><th>項目</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th></tr>
            <tr id="tmRankRow"></tr><tr id="tmSalaryRow"></tr>
        </table>
    </div>

    <table style="width:100%; text-align:center; border-collapse:collapse;">
        <thead><tr style="background:#f4f4f4;"><th>姓名</th><th>年度</th><th>平均分</th><th>五一</th><th>端午</th><th>中秋</th><th>年終</th><th style="color:var(--project)">專案獎金基數/最終額</th><th>實領總計</th></tr></thead>
        <tbody id="resultBody"></tbody>
    </table>
    
    <div style="display: flex; gap: 20px; margin-top: 20px;">
        <div style="flex:1; height:400px;"><canvas id="currentYearChart"></canvas></div>
        <div style="flex:1; height:400px;"><canvas id="historyTrendChart"></canvas></div>
    </div>

    <div style="text-align:right; margin-top:20px;">
        <button onclick="handleFinalSave()" class="btn" style="background:var(--success); padding: 15px 50px;">✅ 確認核定存檔</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz9kLPJjKS5XZsYmgy_Hk77YKKL7X_8qIJkQrNGyJLEcGb3XKrb0lotAjcNhRCL5EXB/exec"; 
    let scoreChart=null, currentYearChart=null, historyTrendChart=null, timelineData={}, baseResults={};
    Chart.register(ChartDataLabels);

    window.onload = async () => {
        const res = await fetch(API_URL);
        const r = await res.json();
        document.getElementById('selEmp').innerHTML = r.data.map(e => `<option value="${e.name}" data-rank="${e.rank}" data-salary="${e.salary}">${e.name}</option>`).join('');
        initUI();
    };

    function initUI() {
        const sel = document.getElementById('selEmp');
        const opt = sel.options[sel.selectedIndex];
        const count = opt.dataset.rank === 'L1' ? 12 : 4;
        let h1 = ''; for(let i=0; i<count; i++) h1 += `<input type="number" class="q-score ann-in" oninput="localUpdate()">`;
        document.getElementById('annualInputs').innerHTML = h1;
        let h2 = ''; for(let i=0; i<12; i++) h2 += `<input type="number" class="q-score proj-score prj-in" oninput="localUpdate()">`;
        document.getElementById('projInputs').innerHTML = h2;
        timelineData = { Q1:{r:opt.dataset.rank, s:opt.dataset.salary}, Q2:{r:opt.dataset.rank, s:opt.dataset.salary}, Q3:{r:opt.dataset.rank, s:opt.dataset.salary}, Q4:{r:opt.dataset.rank, s:opt.dataset.salary} };
        autoCalc(true); 
    }

    function localUpdate() {
        const getAvg = (cls) => {
            const vals = Array.from(document.querySelectorAll(cls)).map(i => parseFloat(i.value)).filter(v => !isNaN(v));
            return vals.length > 0 ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2) : "0.00";
        };
        document.getElementById('avgSpan').innerText = getAvg('.ann-in');
        document.getElementById('projAvgSpan').innerText = getAvg('.prj-in');
        updateScoreChart();
        clearTimeout(window.calcTimer);
        window.calcTimer = setTimeout(autoCalc, 800);
    }

    async function autoCalc(forceSync = false) {
        const avg = document.getElementById('avgSpan').innerText;
        const prjAvg = document.getElementById('projAvgSpan').innerText;
        const annScores = Array.from(document.querySelectorAll('.ann-in')).map(i => i.value || null);
        const prjScores = Array.from(document.querySelectorAll('.prj-in')).map(i => i.value || null);

        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ 
            action: "calculateBonus", empName: document.getElementById('selEmp').value, 
            year: document.getElementById('calcYear').value, scores: annScores, 
            projScores: prjScores, timeline: timelineData, avgScore: avg, projAvg: prjAvg 
        }) });
        const r = await res.json();
        
        if(r.status === "success") {
            if(forceSync) {
                if(r.historyScores) r.historyScores.forEach((v,i) => { if(document.querySelectorAll('.ann-in')[i]) document.querySelectorAll('.ann-in')[i].value = v; });
                if(r.historyProjScores) {
                    const pS = typeof r.historyProjScores === 'string' ? JSON.parse(r.historyProjScores) : r.historyProjScores;
                    pS.forEach((v,i) => { if(document.querySelectorAll('.prj-in')[i]) document.querySelectorAll('.prj-in')[i].value = v; });
                }
                if(r.historyTimeline) timelineData = r.historyTimeline;
                localUpdate();
            }
            baseResults = r.data;
            renderTimelineUI();
            const adjs = r.historyAdjs || [0,0,0,0,80000,0]; // 0-3三節年終公式, 4基數, 5歷史調整值
            
            const projCalc = Math.round(parseFloat(adjs[4]) * (baseResults.projMult || 0));
            
            // 處理歷史數據：如果歷史有紀錄「最終領取金額」，則反推
            const getHistVal = (i, base) => adjs[i] === 0 ? base : (base + adjs[i]);

            document.getElementById('resultBody').innerHTML = `
                <tr>
                    <td>${document.getElementById('selEmp').value}</td><td>${document.getElementById('calcYear').value}</td>
                    <td style="font-weight:bold; color:blue;">${avg}</td>
                    ${ ['f1','f2','f3','ye'].map((k, i) => `
                        <td>
                            <small style="color:green;font-weight:bold">${baseResults[k]}</small><br>
                            <input type="number" class="target-input" id="target_${k}" value="${getHistVal(i, baseResults[k])}" oninput="refreshTotal()">
                        </td>`).join('') }
                    <td>
                        基數：<input type="number" class="tm-input" id="adj_proj_base" value="${adjs[4]}" oninput="refreshTotal()" style="width:70px;"><br>
                        <small style="color:var(--project)">試算: ${projCalc.toLocaleString()}</small><br>
                        最終：<input type="number" class="target-input" id="target_proj" value="${getHistVal(5, projCalc)}" oninput="refreshTotal()">
                    </td>
                    <td id="totalCell" class="total-cell">0</td>
                </tr>`;
            refreshTotal();
        }
    }

    function refreshTotal() {
        const totalCell = document.getElementById('totalCell');
        if (!totalCell) return;
        let t = 0;
        ['f1', 'f2', 'f3', 'ye'].forEach(k => {
            const targetEl = document.getElementById('target_' + k);
            t += targetEl ? parseFloat(targetEl.value) || 0 : 0;
        });
        const targetProj = document.getElementById('target_proj');
        t += targetProj ? parseFloat(targetProj.value) || 0 : 0;
        totalCell.innerText = t.toLocaleString();
        if(document.getElementById('adminZone').style.display === 'block') updateAdminCharts();
    }

    function updateAdminCharts() {
        const ctx1 = document.getElementById('currentYearChart').getContext('2d');
        if (currentYearChart) currentYearChart.destroy();
        
        const pBase = parseFloat(document.getElementById('adj_proj_base').value) || 0;
        const pCalc = Math.round(pBase * (baseResults.projMult || 0));

        // 計算差額以便畫圖
        const getDiff = (id, base) => (parseFloat(document.getElementById(id)?.value) || 0) - base;

        currentYearChart = new Chart(ctx1, {
            type: 'bar',
            data: { 
                labels: ['五一', '端午', '中秋', '年終', '專案'], 
                datasets: [
                    { label: '公式/基數', data: ['f1','f2','f3','ye'].map(k => baseResults[k]).concat([pCalc]), backgroundColor: ['#27ae60','#27ae60','#27ae60','#27ae60','#2980b9'], stack: 'S' },
                    { label: '手動增減', data: ['f1','f2','f3','ye'].map(k => getDiff('target_'+k, baseResults[k])).concat([getDiff('target_proj', pCalc)]), backgroundColor: '#e74c3c', stack: 'S' }
                ]
            },
            options: { maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
        });
    }

    // 其餘 initUI, renderTimelineUI, updateTimeline, updateScoreChart, handleFinalSave 維持上一版本邏輯，僅需更新 handleFinalSave 打包調整值
    async function handleFinalSave() {
        const pBase = parseFloat(document.getElementById('adj_proj_base').value) || 0;
        const pCalc = Math.round(pBase * (baseResults.projMult || 0));
        const getDiff = (id, base) => (parseFloat(document.getElementById(id).value) || 0) - base;

        const data = {
            action: "saveRecord", year: document.getElementById('calcYear').value, empName: document.getElementById('selEmp').value,
            rank: timelineData.Q4.r, avgScore: document.getElementById('avgSpan').innerText,
            f1_base: baseResults.f1, f1_adj: getDiff('target_f1', baseResults.f1),
            f2_base: baseResults.f2, f2_adj: getDiff('target_f2', baseResults.f2),
            f3_base: baseResults.f3, f3_adj: getDiff('target_f3', baseResults.f3),
            ye_base: baseResults.ye, ye_adj: getDiff('target_ye', baseResults.ye),
            proj_final_base: pBase,
            proj_adj: getDiff('target_proj', pCalc),
            total: document.getElementById('totalCell').innerText.replace(/,/g, ''),
            scores: Array.from(document.querySelectorAll('.ann-in')).map(i => i.value || null),
            projScores: Array.from(document.querySelectorAll('.prj-in')).map(i => i.value || null),
            timeline: timelineData
        };
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(data) });
        if((await res.json()).status === "success") alert("✅ 核定存檔成功！已自動紀錄目標金額與調整差額。");
    }

    // 其餘輔助函式 (askPassword, downloadImg, updateScoreChart, renderTimelineUI) 請沿用前一版本
    function renderTimelineUI() {
        let rHtml = '<td>職等</td>', sHtml = '<td>月薪</td>';
        ['Q1','Q2','Q3','Q4'].forEach(q => {
            rHtml += `<td><select class="tm-rank-sel" data-q="${q}" onchange="updateTimeline('${q}', 'r', this.value)"><option value="L1">L1</option><option value="L2">L2</option><option value="L3">L3</option><option value="L4">L4</option></select></td>`;
            sHtml += `<td><input type="number" value="${timelineData[q].s}" oninput="updateTimeline('${q}', 's', this.value)" style="width:80px;"></td>`;
        });
        document.getElementById('tmRankRow').innerHTML = rHtml;
        document.getElementById('tmSalaryRow').innerHTML = sHtml;
        document.querySelectorAll('.tm-rank-sel').forEach(sel => sel.value = timelineData[sel.dataset.q].r);
    }
    function updateTimeline(q, field, val) { timelineData[q][field] = field === 's' ? (parseFloat(val) || 0) : val; autoCalc(); }
    function updateScoreChart() {
        const ctx = document.getElementById('scoreChart').getContext('2d');
        if (scoreChart) scoreChart.destroy();
        const annRaw = Array.from(document.querySelectorAll('.ann-in')).map(i => parseFloat(i.value));
        const prjData = Array.from(document.querySelectorAll('.prj-in')).map(i => parseFloat(i.value));
        let annMapped = annRaw.length === 4 ? [{x:3,y:annRaw[0]},{x:6,y:annRaw[1]},{x:9,y:annRaw[2]},{x:12,y:annRaw[3]}] : annRaw.map((v,i)=>({x:i+1,y:v}));
        scoreChart = new Chart(ctx, {
            type: 'line',
            data: { datasets: [
                { label: '年度評分', data: annMapped, borderColor: '#3498db', tension: 0.3, pointRadius: 6 },
                { label: '專案評分', data: prjData.map((v,i)=>({x:i+1,y:v})), borderColor: '#e67e22', borderDash: [5,5], pointRadius: 4 }
            ]},
            options: { 
                maintainAspectRatio: false,
                scales: { x: { type: 'linear', min: 1, max: 12, ticks: { stepSize: 1, callback: v => v+'月' } } },
                plugins: { datalabels: { align: 'top', offset: 8, font: { weight: 'bold' }, formatter: v => v.y || '' } }
            }
        });
    }
    function askPassword() { if(prompt("密碼")==="0000") { document.getElementById('adminZone').style.display='block'; setTimeout(refreshTotal, 100); } }
    function downloadImg(id, name) { const l = document.createElement('a'); l.href = document.getElementById(id).toDataURL(); l.download = name; l.click(); }
</script>
</body>
</html>
