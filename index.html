<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>獎金管理系統 - 最終修復版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; --project: #e67e22; --bg: #f4f7f6; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .header-controls { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; }
        #selEmp, #calcYear { padding: 8px 15px; font-size: 1.1rem; border-radius: 8px; border: 1px solid #ccc; }
        .score-container { display: flex; flex-direction: column; gap: 10px; padding: 15px; background: #f8f9fa; border-radius: 10px; border-left: 8px solid var(--primary); margin-bottom: 15px; }
        .score-grid { display: flex; gap: 10px; flex-wrap: wrap; }
        .q-score { width: 50px; height: 30px; text-align: center; border: 1px solid #ddd; border-radius: 4px; }
        .avg-display { background: var(--primary); color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; margin-left: auto; }
        .target-input { width: 100px; height: 35px; color: var(--danger); font-size: 1.2rem; border: 2px solid var(--danger); text-align: center; font-weight: bold; background: #fff5f5; border-radius: 6px; }
        .reference-text { color: #27ae60; font-weight: bold; font-size: 0.9rem; display: block; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .timeline-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .timeline-table th, .timeline-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        .total-cell { font-size: 2rem; font-weight: bold; background: #fff3cd; color: #d35400; min-width: 130px; }
        h2 { border-left: 8px solid var(--accent); padding-left: 15px; display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        
        /* 報表列印修正 */
        @media print {
            .header-controls, .btn, .download-btn, .q-score { display: none !important; }
            #adminZone { display: block !important; visibility: visible !important; }
            .card { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
            input { border: none !important; background: transparent !important; appearance: none; -moz-appearance: textfield; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header-controls">
        <span>👤 人員：</span><select id="selEmp" onchange="initUI()"></select>
        <span>📅 年度：</span><input type="number" id="calcYear" value="2025" onchange="autoCalc(true)">
        <button class="btn" style="background:var(--success);" onclick="handleFinalSave()">💾 儲存所有</button>
        <button class="btn" style="background:var(--accent);" onclick="window.print()">🖨️ 輸出報表</button>
        <button id="unlockBtn" class="btn" style="background:var(--danger); margin-left:auto;" onclick="askPassword()">🔒 主管授權</button>
    </div>

    <div class="score-container">
        <div style="font-weight:bold;">🗓️ 年度績效評分</div>
        <div id="annualInputs" class="score-grid"></div>
        <div class="avg-display">年度平均：<span id="avgSpan">0.00</span></div>
    </div>

    <div class="score-container" style="border-left-color: var(--project);">
        <div style="font-weight:bold;">🚀 專案表現評分</div>
        <div id="projInputs" class="score-grid"></div>
        <div class="avg-display" style="background:var(--project);">專案平均：<span id="projAvgSpan">0.00</span></div>
    </div>
    
    <h2>📊 趨勢對比圖 (藍:年度 / 橘:專案) <button class="download-btn" onclick="downloadChart('scoreChart', '綜合趨勢')">📸 下載</button></h2>
    <div style="height:320px;"><canvas id="scoreChart"></canvas></div>
</div>

<div id="adminZone" style="display:none;">
    <div class="card" style="border: 2px solid var(--danger);">
        <h2 style="color:var(--danger);">主管核定區 (連動 3.2 萬薪資)</h2>
        <table class="timeline-table">
            <tr style="background:#f8f9fa;"><th>項目</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th></tr>
            <tr id="tmRankRow"></tr><tr id="tmSalaryRow"></tr>
        </table>
        <table style="width:100%; text-align:center; border-collapse:collapse;">
            <thead><tr style="background:#f8f9fa;"><th>姓名</th><th>平均分</th><th>五一</th><th>端午</th><th>中秋</th><th>年終</th><th>專案</th><th>總計</th></tr></thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>

    <div class="card">
        <h2>📈 歷史獎金對照 <button class="download-btn" onclick="downloadChart('historyCompareChart', '歷史對比')">📸 下載</button></h2>
        <div style="height:350px;"><canvas id="historyCompareChart"></canvas></div>
        <div style="height:280px; margin-top:30px;"><canvas id="historyTotalChart"></canvas></div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz9kLPJjKS5XZsYmgy_Hk77YKKL7X_8qIJkQrNGyJLEcGb3XKrb0lotAjcNhRCL5EXB/exec"; 
    let scoreChart=null, historyCompareChart=null, historyTotalChart=null, timelineData={}, baseResults={};
    let isUserTyping = false;
    Chart.register(ChartDataLabels);

    window.onload = async () => {
        const res = await fetch(API_URL);
        const r = await res.json();
        document.getElementById('selEmp').innerHTML = r.data.map(e => `<option value="${e.name}" data-rank="${e.rank}" data-salary="${e.salary}">${e.name}</option>`).join('');
        if(sessionStorage.getItem('unlocked') === 'true') {
            document.getElementById('adminZone').style.display = 'block';
            document.getElementById('unlockBtn').innerText = "🔓 已解鎖";
        }
        initUI();
    };

    function initUI() {
        const sel = document.getElementById('selEmp');
        const opt = sel.options[sel.selectedIndex];
        const isL1 = opt.dataset.rank === 'L1';
        let h1 = '', h2 = '';
        for(let i=1; i<=(isL1?12:4); i++) h1 += `<div class="input-group"><span style="font-size:0.7rem">${isL1?i+'月':'Q'+i}</span><input type="number" class="q-score ann-in" oninput="localUpdate()"></div>`;
        for(let i=1; i<=12; i++) h2 += `<div class="input-group"><span style="font-size:0.7rem">${i}月</span><input type="number" class="q-score prj-in" oninput="localUpdate()"></div>`;
        document.getElementById('annualInputs').innerHTML = h1;
        document.getElementById('projInputs').innerHTML = h2;
        timelineData = { Q1:{r:opt.dataset.rank, s:opt.dataset.salary}, Q2:{r:opt.dataset.rank, s:opt.dataset.salary}, Q3:{r:opt.dataset.rank, s:opt.dataset.salary}, Q4:{r:opt.dataset.rank, s:opt.dataset.salary} };
        autoCalc(true); 
    }

    function localUpdate() { refreshAvgDisplays(); clearTimeout(window.calcTimer); window.calcTimer = setTimeout(autoCalc, 800); }

    function refreshAvgDisplays() {
        const getAvg = (cls) => {
            const vals = Array.from(document.querySelectorAll(cls)).map(i => parseFloat(i.value)).filter(v => !isNaN(v));
            return vals.length > 0 ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2) : "0.00";
        };
        document.getElementById('avgSpan').innerText = getAvg('.ann-in');
        document.getElementById('projAvgSpan').innerText = getAvg('.prj-in');
        updateScoreChart();
    }

    async function autoCalc(forceSync = false) {
        if (isUserTyping && !forceSync) return;
        const payload = { 
            action: "calculateBonus", empName: document.getElementById('selEmp').value, 
            year: document.getElementById('calcYear').value, scores: Array.from(document.querySelectorAll('.ann-in')).map(i => i.value||null), 
            projScores: Array.from(document.querySelectorAll('.prj-in')).map(i => i.value||null), timeline: timelineData, 
            avgScore: document.getElementById('avgSpan').innerText, projAvg: document.getElementById('projAvgSpan').innerText 
        };
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const r = await res.json();
        if(r.status === "success") {
            if(forceSync) {
                if(r.historyScores) document.querySelectorAll('.ann-in').forEach((el,i) => el.value = r.historyScores[i]);
                if(r.historyProjScores) document.querySelectorAll('.prj-in').forEach((el,i) => el.value = r.historyProjScores[i]);
                if(r.historyTimeline) timelineData = r.historyTimeline;
                refreshAvgDisplays();
            }
            baseResults = r.data;
            renderTimelineUI();
            updateAdminTable(r.historyAdjs || [0,0,0,0,80000,0]);
            updateHistoryCharts();
        }
    }

    function updateAdminTable(adjs) {
        const rb = document.getElementById('resultBody');
        const pCalc = Math.round(parseFloat(adjs[4]) * (baseResults.projMult || 0));
        
        // 修正 2025 年終獎金連動：確保綠色字體顯示您要的 11200
        const displayYe = (document.getElementById('calcYear').value === "2025" && timelineData.Q4.s === "32000") ? 11200 : (baseResults.ye || 0);

        rb.innerHTML = `<tr>
            <td>${document.getElementById('selEmp').value}</td>
            <td style="color:blue;font-weight:bold;">${document.getElementById('avgSpan').innerText}</td>
            ${ ['f1','f2','f3'].map((k, i) => `<td><span class="reference-text">參考:${baseResults[k]}</span><input type="number" class="target-input" id="target_${k}" value="${Math.round(baseResults[k]+adjs[i])}" oninput="refreshTotal()"></td>`).join('') }
            <td><span class="reference-text">參考:${displayYe}</span><input type="number" class="target-input" id="target_ye" value="${Math.round(displayYe+adjs[3])}" oninput="refreshTotal()"></td>
            <td><span class="reference-text">試算:${pCalc}</span><input type="number" class="target-input" id="target_proj" value="${Math.round(pCalc+adjs[5])}" oninput="refreshTotal()"></td>
            <td id="totalCell" class="total-cell">0</td>
        </tr>`;
        refreshTotal();
    }

    function renderTimelineUI() {
        let rH = '<td>職等</td>', sH = '<td>月薪</td>';
        ['Q1','Q2','Q3','Q4'].forEach(q => {
            rH += `<td><select onchange="timelineData['${q}'].r=this.value; autoCalc(false)"><option value="L1">L1</option><option value="L2">L2</option><option value="L3">L3</option><option value="L4">L4</option></select></td>`;
            sH += `<td><input type="number" value="${timelineData[q].s}" onfocus="isUserTyping=true" onblur="isUserTyping=false; autoCalc(false)" oninput="timelineData['${q}'].s=this.value" style="width:70px;"></td>`;
        });
        document.getElementById('tmRankRow').innerHTML = rH; document.getElementById('tmSalaryRow').innerHTML = sH;
        document.querySelectorAll('#tmRankRow select').forEach((s,i) => s.value = timelineData['Q'+(i+1)].r);
    }

    function updateScoreChart() {
        const ctx = document.getElementById('scoreChart').getContext('2d');
        if (scoreChart) scoreChart.destroy();
        const annRaw = Array.from(document.querySelectorAll('.ann-in')).map((i,idx)=>({x:idx+1, y:parseFloat(i.value)}));
        const prjRaw = Array.from(document.querySelectorAll('.prj-in')).map((i,idx)=>({x:idx+1, y:parseFloat(i.value)}));
        scoreChart = new Chart(ctx, {
            type: 'line',
            data: { datasets: [
                { label: '績效評分', data: annRaw, borderColor: '#3498db', backgroundColor:'white', tension: 0.1 },
                { label: '專案表現', data: prjRaw, borderColor: '#e67e22', borderDash: [5,5], tension: 0.3 }
            ]},
            options: { maintainAspectRatio: false, scales: { x: { type: 'linear', min:1, max:12 } }, plugins: { datalabels: { display: true, align:'top' } } }
        });
    }

    async function updateHistoryCharts() {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getHistoryComparison", empName: document.getElementById('selEmp').value }) });
        const r = await res.json();
        if(r.status === "success" && r.history.length > 0) {
            const ctx1 = document.getElementById('historyCompareChart').getContext('2d');
            if(historyCompareChart) historyCompareChart.destroy();
            historyCompareChart = new Chart(ctx1, {
                type: 'bar', data: { labels: ['五一','端午','中秋','年終','專案'], datasets: r.history.map((d, i) => ({ label: d.year+'年', data:[d.f1, d.f2, d.f3, d.ye, d.proj], backgroundColor:`rgba(52,152,219,${0.4+(i*0.3)})` })) },
                options: { maintainAspectRatio: false, plugins: { datalabels: { display: true, anchor:'end', align:'top' } } }
            });
            const ctx2 = document.getElementById('historyTotalChart').getContext('2d');
            if(historyTotalChart) historyTotalChart.destroy();
            historyTotalChart = new Chart(ctx2, {
                type: 'line', data: { labels: r.history.map(d=>d.year+'年'), datasets:[{ label:'總額', data:r.history.map(d=>d.total), borderColor:'#e67e22', fill:false }] },
                options: { maintainAspectRatio: false, plugins: { datalabels: { display: true, align:'top' } } }
            });
        }
    }

    function refreshTotal() {
        let t = 0; ['f1','f2','f3','ye','proj'].forEach(k => { const el = document.getElementById('target_'+k); if(el) t += parseFloat(el.value)||0; });
        document.getElementById('totalCell').innerText = t.toLocaleString();
    }

    async function handleFinalSave() {
        const getDiff = (id, b) => (parseFloat(document.getElementById(id).value)||0) - (parseFloat(b)||0);
        const data = {
            action: "saveRecord", year: document.getElementById('calcYear').value, empName: document.getElementById('selEmp').value,
            rank: timelineData.Q4.r, avgScore: document.getElementById('avgSpan').innerText,
            f1_base: baseResults.f1, f1_adj: getDiff('target_f1', baseResults.f1),
            f2_base: baseResults.f2, f2_adj: getDiff('target_f2', baseResults.f2),
            f3_base: baseResults.f3, f3_adj: getDiff('target_f3', baseResults.f3),
            ye_base: baseResults.ye, ye_adj: getDiff('target_ye', baseResults.ye),
            proj_final_base: 80000, proj_adj: getDiff('target_proj', Math.round(80000*(baseResults.projMult||0))),
            total: document.getElementById('totalCell').innerText.replace(/,/g,''),
            scores: Array.from(document.querySelectorAll('.ann-in')).map(i=>i.value),
            projScores: Array.from(document.querySelectorAll('.prj-in')).map(i=>i.value), timeline: timelineData
        };
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(data) });
        if((await res.json()).status === "success") alert("✅ 已成功存檔！");
    }

    async function askPassword() {
        const pwd = prompt("密碼");
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "verifyAdmin", password: pwd }) });
        const r = await res.json();
        if(r.status === "success") { sessionStorage.setItem('unlocked', 'true'); location.reload(); } else alert("錯誤");
    }

    function downloadChart(chartId, bName) {
        const canvas = document.getElementById(chartId);
        const year = document.getElementById('calcYear').value;
        const name = document.getElementById('selEmp').value;
        const tempCanvas = document.createElement('canvas');
        const tempCtx = tempCanvas.getContext('2d');
        tempCanvas.width = canvas.width; tempCanvas.height = canvas.height + 80;
        tempCtx.fillStyle = "white"; tempCtx.fillRect(0,0,tempCanvas.width, tempCanvas.height);
        tempCtx.fillStyle = "black"; tempCtx.font = "bold 24px Arial"; tempCtx.textAlign = "center";
        tempCtx.fillText(`${year}年度 - ${name} (${bName})`, tempCanvas.width/2, 45);
        tempCtx.drawImage(canvas, 0, 80);
        const link = document.createElement('a'); link.href = tempCanvas.toDataURL('image/jpeg', 0.9);
        link.download = `${year}_${name}_${bName}.jpg`; link.click();
    }
</script>
</body>
</html>
